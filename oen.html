<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>応援一覧</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
    h1 { font-size: 1.2rem; text-align: center; margin: 6px 0; }
    .back { display: table; text-align: center; margin: 4px auto 8px; color: #4a90e2; text-decoration: none; }
    .top-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .month-select { font-size: 0.9rem; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { font-size: 0.82rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; background: #4a90e2; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 8px; }
    .filter-btn { padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 6px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; background: white; font-size: 0.75rem; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin: 0 auto; }
    th { background: #dde; padding: 4px 3px; text-align: center; border: 1px solid #ccc; min-width: 34px; }
    th.name-th { min-width: 90px; position: sticky; left: 0; z-index: 2; background: #dde; }
    th.sat { background: #d0e8ff; }
    th.sun { background: #ffd0d0; }
    td { padding: 3px 2px; text-align: center; border: 1px solid #eee; vertical-align: top; }
    td.name-td { position: sticky; left: 0; background: white; z-index: 1; padding: 3px 6px; min-width: 90px; font-size: 0.78rem; text-align: center; vertical-align: middle; }
    td.sat-col { background: #f0f6ff; }
    td.sun-col { background: #fff0f0; }
    tr.hidden { display: none; }
    .badge-wrap { display: flex; gap: 2px; justify-content: center; align-items: flex-start; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 1px; border-radius: 3px; font-size: 0.68rem; font-weight: bold;
      min-width: 16px; min-height: 30px;
      writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 1px;
    }
    .loading { text-align: center; padding: 30px; color: #888; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 id="page-title">🔄 応援一覧</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>

  <div class="top-bar">
    <select class="month-select" id="month-sel" onchange="loadData()"></select>
    <button class="btn" onclick="loadData()">表示</button>
    <button class="btn" id="inner-move-toggle" style="background:#888" onclick="toggleInnerMove()">部門内異動も表示</button>
    <button class="btn" id="badge-mode-toggle" style="background:#16a085" onclick="toggleBadgeMode()">🔀 表示：所属名</button>
  </div>

  <div class="filter-row" id="group-filter-row"></div>
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" style="background:#555;color:white" onclick="filterTable(null, this)">全員</button>
  </div>

  <div class="loading" id="loading">読み込み中…</div>

  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let staffRows = [];
    let oenRows = [];   // 業務シフトから算出した応援実績（{date, staff_code, busho_code}の配列）
    let currentYM = '';
    let daysInMonth = 31;
    let currentFilter = null; // null = 全員。絞り込み中はbusho_codeの配列
    let showInnerMove = false; // 上位部門が同じ所属同士の異動（部門内異動）も表示するかどうか
    let badgeLabelMode = 'busho'; // 'busho'=所属名で表示 / 'gyomu'=業務名（運転1など）で表示

    function toggleInnerMove() {
      showInnerMove = !showInnerMove;
      const btn = document.getElementById('inner-move-toggle');
      btn.style.background = showInnerMove ? '#2980b9' : '#888';
      renderTable();
    }

    function toggleBadgeMode() {
      badgeLabelMode = badgeLabelMode === 'busho' ? 'gyomu' : 'busho';
      document.getElementById('badge-mode-toggle').textContent =
        badgeLabelMode === 'busho' ? '🔀 表示：所属名' : '🔀 表示：業務名';
      renderTable();
    }

    async function init() {
      masters = await loadMasters();

      currentYM = typeof getCurrentYearMonth === 'function' ? getCurrentYearMonth()
        : (() => { const n = new Date(); return `${n.getFullYear()}${String(n.getMonth() + 1).padStart(2, '0')}`; })();
      buildMonthSelect();
      buildFilterButtons();

      await loadData();
    }

    // ===== 月セレクト =====
    function buildMonthSelect() {
      const sel = document.getElementById('month-sel');
      const now = new Date();
      for (let i = -6; i <= 1; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const ym = `${y}${m}`;
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y}年${m}月`;
        if (ym === currentYM) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    // ===== 部門（上位グループ）・所属フィルターボタン（900番台は除く）=====
    function buildFilterButtons() {
      const normalBushos = masters.bushos.filter(b => parseInt(b.busho_code) < 900);

      // 上位部門（例：宅配）でまとめて絞り込むボタン
      const groupRow = document.getElementById('group-filter-row');
      const groupNames = [...new Set(normalBushos.map(b => b.group_name).filter(v => v))];
      groupNames.forEach(groupName => {
        const bushoCodes = normalBushos.filter(b => b.group_name === groupName).map(b => b.busho_code);
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = '#8e44ad';
        btn.style.color = '#fff';
        btn.textContent = `📦${groupName}`;
        btn.onclick = () => filterTable(bushoCodes, btn);
        groupRow.appendChild(btn);
      });

      // 所属ごとの絞り込みボタン（今まで通り。盤面専用の所属は、実際の所属登録には使われないのでボタンには出さない）
      const row = document.getElementById('filter-row');
      normalBushos.filter(b => !b.is_banmen_only).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = b.color_h || '#888';
        btn.style.color = getTextColor(b.color_h || '#888');
        btn.textContent = b.busho_name;
        btn.onclick = () => filterTable([b.busho_code], btn);
        row.appendChild(btn);
      });
    }

    // bushoCodes: null（全員）または 絞り込み対象の所属コード配列
    function filterTable(bushoCodes, btn) {
      currentFilter = bushoCodes;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTable();
    }

    // ===== データ読み込み =====
    async function loadData() {
      currentYM = document.getElementById('month-sel').value || currentYM;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('table-wrap').style.display = 'none';

      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));
      daysInMonth = new Date(year, month, 0).getDate();

      const [staffRes, shiftRes, gyomuRes] = await Promise.all([
        sb.from('shift_staff').select('staff_code, name, busho_code').order('staff_code'),
        sb.from('shift_gyomu_shift').select('*').eq('yearmonth', currentYM),
        sb.from('shift_gyomu').select('gyomu_code, busho_code'),
      ]);

      if (staffRes.error || shiftRes.error || gyomuRes.error) {
        showMsg('データの読み込みに失敗しました', 'err');
        console.error(staffRes.error || shiftRes.error || gyomuRes.error);
        return;
      }

      staffRows = staffRes.data || [];
      oenRows = buildOenRowsFromShift(staffRows, shiftRes.data || [], gyomuRes.data || []);

      buildHeader();
      renderTable();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('table-wrap').style.display = 'block';
    }

    // ===== 業務シフトから「応援」実績を算出する =====
    // 考え方：その日にやった業務の所属が、本人の所属（社員マスタのbusho_code）と違っていれば「応援」とみなす。
    // 休日・有休・健診・講習（901〜のコード）は業務マスタに無いコードなので、自然に対象外になる。
    // 午前・午後の両方がその所属なら「1日応援」、片方だけなら（もう片方は自分の所属や空欄）「半日応援」とする。
    function buildOenRowsFromShift(staffList, shiftRows, gyomuRows) {
      const staffBushoMap = {};
      staffList.forEach(s => { staffBushoMap[s.staff_code] = s.busho_code; });

      const gyomuBushoMap = {};
      gyomuRows.forEach(g => { gyomuBushoMap[g.gyomu_code] = g.busho_code; });

      const result = [];

      // 所属コード→上位部門名（group_name）を引けるようにしておく
      // 上位部門が同じ所属同士の異動は「応援」とはみなさない
      const bushoGroupMap = {};
      (masters.bushos || []).forEach(b => { bushoGroupMap[b.busho_code] = b.group_name || null; });

      shiftRows.forEach(row => {
        const myBusho = staffBushoMap[row.staff_code];
        if (!myBusho) return; // 社員マスタに無い（退職済みなど）場合は対象外
        const myGroup = bushoGroupMap[myBusho];

        for (let d = 1; d <= daysInMonth; d++) {
          const dayKey = `d${String(d).padStart(2, '0')}`;
          const codeA = row[dayKey];
          const codeB = row[dayKey + 'b'];
          const bushoA = (codeA && codeA !== 'EMPTY') ? gyomuBushoMap[codeA] : null;
          const bushoB = (codeB && codeB !== 'EMPTY') ? gyomuBushoMap[codeB] : null;

          // 自分の所属とは違う、業務マスタに実在する所属だけを対象にする
          const otherBushos = [...new Set([bushoA, bushoB].filter(b => b && b !== myBusho))];
          if (otherBushos.length === 0) continue;

          const dateStr = `${currentYM}${String(d).padStart(2, '0')}`;
          otherBushos.forEach(bushoCode => {
            const countSlots = [bushoA, bushoB].filter(b => b === bushoCode).length;
            // その所属ではないもう片方の枠が、何か（自分の所属の業務など）で埋まっているかどうか
            const otherSlotFilled = [bushoA, bushoB].some(b => b && b !== bushoCode);
            const isHalfDay = countSlots === 1 && otherSlotFilled;
            // 上位部門（group_name）が自分と同じ所属への異動は「部門内異動」として区別する
            // （デフォルトでは応援一覧に出さず、ボタンで切り替えたときだけ表示する）
            const isInnerMove = !!(myGroup && bushoGroupMap[bushoCode] === myGroup);
            // 業務名表示（「運転1」など）に切り替えられるよう、実際に入っていた業務コードも覚えておく
            const gyomuCode = bushoA === bushoCode ? codeA : codeB;
            result.push({ staff_code: row.staff_code, date: dateStr, busho_code: bushoCode, gyomu_code: gyomuCode, isHalfDay, isInnerMove });
          });
        }
      });

      return result;
    }

    // ===== ヘッダー（日付列）構築 =====
    function buildHeader() {
      const thead = document.getElementById('thead');
      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));

      let html = '<tr><th class="name-th">氏名</th>';
      for (let d = 1; d <= daysInMonth; d++) {
        const wd = new Date(year, month - 1, d).getDay();
        const cls = wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
        html += `<th class="${cls}">${d}<br><span style="font-size:0.62rem">${getWeekdayName(wd)}</span></th>`;
      }
      html += '</tr>';
      thead.innerHTML = html;
    }

    function getDayClass(d) {
      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));
      const wd = new Date(year, month - 1, d).getDay();
      return wd === 0 ? 'sun-col' : wd === 6 ? 'sat-col' : '';
    }

    // ===== 本体テーブル描画 =====
    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      // staff_code → 日付ごとの応援エントリー一覧（「部門内異動も表示」がOFFのときは、部門内異動を除く）
      const byStaff = {};
      oenRows.filter(r => showInnerMove || !r.isInnerMove).forEach(r => {
        if (!byStaff[r.staff_code]) byStaff[r.staff_code] = {};
        if (!byStaff[r.staff_code][r.date]) byStaff[r.staff_code][r.date] = [];
        byStaff[r.staff_code][r.date].push(r);
      });

      // その月に応援実績がある社員だけ表示（社員コード順）
      const targetStaffCodes = Object.keys(byStaff).sort();

      targetStaffCodes.forEach(staffCode => {
        const staff = staffRows.find(s => s.staff_code === staffCode);
        const staffName = staff?.name || staffCode;
        const dayMap = byStaff[staffCode];

        // フィルター中：ボタンを押した人たちの「元々の所属」で絞り込む（応援先ではない）
        if (currentFilter && !currentFilter.includes(staff?.busho_code)) return;

        let rowHtml = `<tr><td class="name-td">${staffName}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${currentYM}${String(d).padStart(2, '0')}`;
          const entries = dayMap[dateStr] || [];

          const badges = entries.map(e => {
            const b = masters.bushoMap[e.busho_code];
            const color = b?.color_h || '#888';
            const bushoName = b?.busho_name || e.busho_code;
            const gyomuName = masters.gyomuMap[e.gyomu_code]?.gyomu_name || bushoName;
            const name = badgeLabelMode === 'gyomu' ? gyomuName : bushoName;
            // 半日応援（午前午後の片方だけ）は、点線の外枠と「半」の1文字で区別する。
            // 縦書きの中でもカッコは不格好になるので使わず、普通の漢字として名前の後ろに続ける
            const halfStyle = e.isHalfDay ? 'outline:2px solid #555;outline-offset:-2px;' : '';
            // 部門内異動は、色を薄くして普通の応援と見分けられるようにする
            const innerStyle = e.isInnerMove ? 'opacity:0.55;' : '';
            const label = e.isHalfDay ? `${name}・半` : name;
            return `<span class="badge" style="background:${color};color:${getTextColor(color)};${halfStyle}${innerStyle}">${label}</span>`;
          }).join('');

          rowHtml += `<td class="${getDayClass(d)}"><div class="badge-wrap">${badges}</div></td>`;
        }
        rowHtml += '</tr>';
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      });

      if (tbody.innerHTML === '') {
        tbody.innerHTML = `<tr><td colspan="${daysInMonth + 1}" style="padding:20px;color:#888;">この月の応援データはありません</td></tr>`;
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    init();
  </script>
</body>
</html>
