<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勤怠管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <script src="exceljs.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
    h1 { font-size: 1.1rem; text-align: center; margin: 8px 0; }
    .back { display: table; margin: 4px auto 8px; color: #4a90e2; text-decoration: none; }

    .top-area { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 10px; }
    select { font-size: 0.9rem; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { font-size: 0.85rem; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-blue { background: #4a90e2; }

    .shd-banner { text-align: center; font-size: 0.85rem; color: #555; margin-bottom: 8px; }
    .shd-banner a { color: #4a90e2; }

    .kijun-box { text-align: center; font-size: 0.85rem; color: #444; margin-bottom: 10px; }
    .kijun-box input { font-size: 0.85rem; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; }

    .fiscal-box { text-align: center; font-size: 0.85rem; color: #444; margin-bottom: 10px; }
    .fiscal-box select { font-size: 0.85rem; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; }
    .year-check-result {
      display: none; max-width: 420px; margin: 0 auto 12px; background: white; border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1); padding: 10px 14px; font-size: 0.85rem;
    }
    .year-check-result .row { padding: 3px 0; }

    .upload-box {
      background: #f0f8ff; border: 1px solid #4a90e2; border-radius: 8px; padding: 12px 16px;
      margin: 0 auto 12px; max-width: 560px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    }
    .upload-box label { font-size: 0.85rem; color: #444; }
    .file-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.82rem; padding: 6px 10px; border-radius: 4px;
      background: #eee; border: 1px solid #ccc; cursor: pointer; color: #333;
    }
    .file-name-display { font-size: 0.8rem; color: #2980b9; }
    .upload-msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin: 0 auto 10px; max-width: 560px; display: none; }
    .upload-msg.ok  { background: #d4edda; color: #155724; display: block; }
    .upload-msg.err { background: #fdecea; color: #c0392b; display: block; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .filter-btn { padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; white-space: nowrap; margin: 0 auto; font-size: 0.82rem; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    th { background: #eee; padding: 6px 8px; text-align: center; border-bottom: 1px solid #ddd; font-size: 0.78rem; }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { background: #ddd; }
    td { padding: 5px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f8f8ff; }
    tr.row-danger td { background: #fde8e8; color: #c0392b; font-weight: bold; }
    tr.row-danger:hover td { background: #fbd8d8; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 0.75rem; }
    .warn  { background: #fff3cd; color: #856404; font-weight: bold; }
    .over  { background: #fde8e8; color: #c0392b; font-weight: bold; }
    .ok    { background: #e8f5e9; color: #1a6e2e; }
    .na    { color: #bbb; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .print-title { display: none; text-align: center; font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; }

    @media print {
      .back, .top-area, .shd-banner, .kijun-box, .fiscal-box, .year-check-result, .upload-box, .upload-msg, .filter-row { display: none !important; }
      #shift-auth-bar { display: none !important; }
      .print-title { display: block; }
      body { background: white; padding: 0; }
      table { box-shadow: none; border-radius: 0; margin: 0; width: 100%; }
      th.sortable { cursor: default; }
      .badge { color: #000 !important; }
      @page { size: landscape; margin: 10mm; }
    }
  </style>
</head>
<body>
  <h1>⏱️ 勤怠管理</h1>
  <a class="back" href="index.html">← メニューへ</a>

  <div class="top-area">
    <select id="ym-sel" onchange="loadData()"></select>
    <a href="master_shotnichi.html" class="btn" style="background:#e67e22;text-decoration:none;">📅 所定日数設定</a>
    <button class="btn" style="background:#555;" onclick="window.print()">🖨️ 印刷する</button>
  </div>

  <div class="print-title" id="print-title"></div>

  <div class="shd-banner" id="shd-banner">読み込み中…</div>

  <div class="kijun-box" id="kijun-box">
    1日あたり基準時間：
    <input type="number" id="kijun-input" min="0" step="0.5" style="width:70px;">
    時間
    <button class="btn" style="background:#27ae60;" onclick="saveKijun()">設定</button>
    <span id="kijun-msg" style="font-size:0.8rem;color:#888;"></span>
  </div>

  <div class="fiscal-box" id="fiscal-box">
    年間残業の年度開始月：
    <select id="fiscal-month-input">
      <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
      <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
      <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
      <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
    </select>
    <button class="btn fiscal-save-btn" style="background:#27ae60;" onclick="saveFiscalStartMonth()">設定</button>
    <button class="btn" style="background:#8e44ad;" onclick="checkYearData()">📊 年間データ確認</button>
    <span id="fiscal-msg" style="font-size:0.8rem;color:#888;"></span>
  </div>

  <div class="year-check-result" id="year-check-result"></div>

  <div class="upload-box">
    <label>📂 勤怠Excelを取り込む：</label>
    <label class="file-btn" for="kintai-file">ファイルの選択</label>
    <input type="file" id="kintai-file" accept=".xlsx" style="display:none" onchange="onFileChosen()">
    <span class="file-name-display" id="kintai-filename">（未選択）</span>
    <button class="btn btn-blue" onclick="doUpload()">取り込む</button>
  </div>
  <div class="upload-msg" id="upload-msg"></div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" id="filter-btn-all" style="background:#555;color:white" onclick="clearFilter()">全員</button>
  </div>

  <div id="loading" class="loading">読み込み中...</div>
  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead>
        <tr>
          <th>社員CD</th><th>氏名</th><th>所属</th><th>勤務日数</th><th>勤務予定日数</th>
          <th class="sortable" id="th-workHours" onclick="sortBy('workHours')">労働時間(h)</th><th>残業時間(h)</th><th>上限時間(h)</th>
          <th class="sortable" id="th-nokoriJikan" onclick="sortBy('nokoriJikan')">残り時間(h)</th><th>残り日数</th><th>1日あたり(h)</th><th>年間残業(h)</th><th>データ基準日</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let currentYM = '';
    let kintaiRows = [];   // 選択月のshift_kintai
    let shoteiDays = null; // 選択月の所定日数
    let hitsuyoKijun = 10; // 「1日あたり」の基準時間（月ごとに設定可能。未設定なら10）
    let fiscalStartMonth = 4; // 年間残業を集計する年度の開始月（設定可能。未設定なら4月）
    let currentFilter = new Set(); // 選んだ所属コードの集合（複数選択可）。空なら全員
    let gyomuShiftMap = {}; // 選択月のshift_gyomu_shift（staff_code → 行）
    let sortKey = null;   // 並び替え対象（'workHours' / 'nokoriJikan' / 'hitsuyoJikan'）
    let sortDir = 'desc'; // 'desc' または 'asc'

    // 並び替えボタンが押されたときの処理。同じ列をもう一度押すと昇順・降順が入れ替わる
    function sortBy(key) {
      if (sortKey === key) {
        sortDir = sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        sortKey = key;
        sortDir = 'desc';
      }
      renderTable();
    }

    // データが無い（－）人は、並び替えても常に一番下に来るようにする
    function compareNullable(a, b, dir) {
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      return dir === 'desc' ? b - a : a - b;
    }

    function updateSortHeaders() {
      const labels = { workHours: '労働時間(h)', nokoriJikan: '残り時間(h)' };
      Object.entries(labels).forEach(([key, label]) => {
        const th = document.getElementById('th-' + key);
        if (!th) return;
        const arrow = sortKey === key ? (sortDir === 'desc' ? ' ▼' : ' ▲') : '';
        th.textContent = label + arrow;
      });
    }

    async function init() {
      masters = await loadMasters();
      currentYM = getCurrentYearMonth();
      buildYmSelect();
      buildFilterButtons();
      lockMasterFormIfNeeded('.upload-box input[type=file], .upload-box button, .kijun-box input, .kijun-box button, .fiscal-box select, .fiscal-save-btn');

      // 年間残業を集計する年度の開始月（設定されていなければ4月のまま）
      const { data: settingRow } = await sb.from('shift_app_settings').select('value').eq('key', 'fiscal_start_month').maybeSingle();
      if (settingRow && settingRow.value) fiscalStartMonth = parseInt(settingRow.value) || 4;
      document.getElementById('fiscal-month-input').value = String(fiscalStartMonth);

      await loadData();
    }

    // 「年度開始月」を保存する（全期間共通の設定なので、月ごとではなく1つだけ）
    async function saveFiscalStartMonth() {
      if (!canEdit()) { document.getElementById('fiscal-msg').textContent = '閲覧のみモードのため変更できません'; return; }
      const val = parseInt(document.getElementById('fiscal-month-input').value);
      const { error } = await sb.from('shift_app_settings')
        .upsert({ key: 'fiscal_start_month', value: String(val) }, { onConflict: 'key' });
      if (error) { document.getElementById('fiscal-msg').textContent = '保存に失敗しました: ' + error.message; return; }
      fiscalStartMonth = val;
      document.getElementById('fiscal-msg').textContent = '✅ 設定しました';
      document.getElementById('year-check-result').style.display = 'none';
      await loadData();
    }

    function buildYmSelect() {
      const sel = document.getElementById('ym-sel');
      const now = new Date();
      for (let i = 1; i >= -11; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const ym = `${y}${m}`;
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y}年${m}月`;
        if (ym === currentYM) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    function buildFilterButtons() {
      const row = document.getElementById('filter-row');
      masters.bushos.filter(b => parseInt(b.busho_code) < 900 && !b.is_banmen_only).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = b.color_h || '#888';
        btn.style.color = getTextColor(b.color_h || '#888');
        btn.textContent = b.busho_name;
        btn.dataset.bushoCode = b.busho_code;
        btn.onclick = () => toggleFilter(b.busho_code, btn);
        row.appendChild(btn);
      });
    }

    // 所属ボタンを押すたびに、選択に追加／解除する（複数選択可）
    function toggleFilter(bushoCode, btn) {
      if (currentFilter.has(bushoCode)) {
        currentFilter.delete(bushoCode);
        btn.classList.remove('active');
      } else {
        currentFilter.add(bushoCode);
        btn.classList.add('active');
      }
      // 1つでも所属を選んでいれば「全員」は非アクティブに、何も選んでいなければ「全員」に戻す
      document.getElementById('filter-btn-all').classList.toggle('active', currentFilter.size === 0);
      renderTable();
    }

    // 「全員」ボタン：選択をすべて解除する
    function clearFilter() {
      currentFilter.clear();
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('filter-btn-all').classList.add('active');
      renderTable();
    }

    function onFileChosen() {
      const f = document.getElementById('kintai-file').files[0];
      document.getElementById('kintai-filename').textContent = f ? f.name : '（未選択）';
    }

    // ===== 所定日数・年度の範囲判定 =====
    // 年度の開始月はfiscalStartMonthで設定可能（既定は4月始まり。
    // 例：4月始まりで2026年7月を選んでいる場合、2026年4月〜2026年7月が対象）
    function fiscalYearMonths(ym) {
      const y = parseInt(ym.substring(0, 4));
      const m = parseInt(ym.substring(4, 6));
      const startOffset = fiscalStartMonth - 1; // 4月始まりなら3
      const fiscalStartYear = m >= fiscalStartMonth ? y : y - 1;
      const list = [];
      for (let i = 0; i < 12; i++) {
        const yy = fiscalStartYear + Math.floor((startOffset + i) / 12);
        const mm = ((startOffset + i) % 12) + 1;
        const targetYm = `${yy}${String(mm).padStart(2, '0')}`;
        list.push(targetYm);
        if (targetYm === ym) break; // 選択月まで
      }
      return list;
    }

    // ===== 年間データの取り込み確認 =====
    // 年度内の各月について、その月のデータが月末まできちんと取り込まれているかを確認する。
    // データ基準日（as_of_date）が、その月の最終日より前であれば「途中までかもしれない」と警告する。
    async function checkYearData() {
      const months = fiscalYearMonths(currentYM);
      const realYm = getCurrentYearMonth();

      const { data: allRows, error } = await sb.from('shift_kintai')
        .select('yearmonth, staff_code, as_of_date').in('yearmonth', months);
      if (error) { alert('確認に失敗しました: ' + error.message); return; }

      const byMonth = {};
      months.forEach(ym => { byMonth[ym] = []; });
      (allRows || []).forEach(r => { if (byMonth[r.yearmonth]) byMonth[r.yearmonth].push(r); });

      const results = months.map(ym => {
        const { year, month } = parseYearMonth(ym);
        const label = `${year}年${month}月`;

        if (ym === realYm) {
          return { icon: '🔵', label, text: '今月（進行中）' };
        }

        const rowsForMonth = byMonth[ym];
        if (rowsForMonth.length === 0) {
          return { icon: '⚪', label, text: 'まだ取り込まれていません' };
        }

        const lastDay = getDaysInMonth(year, month);
        const lastDayStr = `${year}-${String(month).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
        const incomplete = rowsForMonth.some(r => !r.as_of_date || r.as_of_date < lastDayStr);
        if (incomplete) {
          return { icon: '⚠️', label, text: '月末より前のデータのままかもしれません（要確認）' };
        }
        return { icon: '✅', label, text: '月末まで取り込み済み' };
      });

      renderYearCheckResults(results);
    }

    function renderYearCheckResults(results) {
      const el = document.getElementById('year-check-result');
      el.innerHTML = results.map(r => `<div class="row">${r.icon} <strong>${r.label}</strong>：${r.text}</div>`).join('');
      el.style.display = 'block';
    }

    async function loadData() {
      currentYM = document.getElementById('ym-sel').value || currentYM;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('table-wrap').style.display = 'none';

      const [kintaiRes, shdRes, fyRes, gyomuShiftRes] = await Promise.all([
        sb.from('shift_kintai').select('*').eq('yearmonth', currentYM),
        sb.from('shift_shotnichi').select('*').eq('yearmonth', currentYM).maybeSingle(),
        sb.from('shift_kintai').select('staff_code, yearmonth, overtime_hours').in('yearmonth', fiscalYearMonths(currentYM)),
        sb.from('shift_gyomu_shift').select('*').eq('yearmonth', currentYM),
      ]);

      if (kintaiRes.error) { showUploadMsg('データの読み込みに失敗しました', 'err'); }
      kintaiRows = kintaiRes.data || [];
      shoteiDays = shdRes.data ? shdRes.data.shotei_days : null;
      hitsuyoKijun = (shdRes.data && shdRes.data.hitsuyo_kijun != null) ? shdRes.data.hitsuyo_kijun : 10;
      gyomuShiftMap = Object.fromEntries((gyomuShiftRes.data || []).map(r => [r.staff_code, r]));

      // 年間残業（年度4月〜選択月までのovertime_hours合計）をstaff_codeごとに集計
      window.__nenkanZangyo = {};
      (fyRes.data || []).forEach(r => {
        window.__nenkanZangyo[r.staff_code] = (window.__nenkanZangyo[r.staff_code] || 0) + (r.overtime_hours || 0);
      });

      document.getElementById('kijun-input').value = hitsuyoKijun;
      document.getElementById('kijun-msg').textContent = '';

      renderShdBanner();
      renderTable();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('table-wrap').style.display = 'block';
    }

    // 「1日あたり基準時間」を、選択中の月に対して保存する
    async function saveKijun() {
      if (!canEdit()) { document.getElementById('kijun-msg').textContent = '閲覧のみモードのため変更できません'; return; }
      const val = document.getElementById('kijun-input').value;
      const kijun = val === '' ? null : parseFloat(val);

      const { data: existing } = await sb.from('shift_shotnichi').select('yearmonth').eq('yearmonth', currentYM).maybeSingle();
      if (!existing) {
        document.getElementById('kijun-msg').textContent = '先にこの月の所定日数を設定してください（📅 所定日数設定）';
        return;
      }
      const { error } = await sb.from('shift_shotnichi').update({ hitsuyo_kijun: kijun }).eq('yearmonth', currentYM);
      if (error) { document.getElementById('kijun-msg').textContent = '保存に失敗しました: ' + error.message; return; }

      hitsuyoKijun = kijun != null ? kijun : 10;
      document.getElementById('kijun-msg').textContent = '✅ 設定しました';
      renderTable();
    }

    function renderShdBanner() {
      const el = document.getElementById('shd-banner');
      const y = currentYM.substring(0, 4), m = currentYM.substring(4, 6);
      if (shoteiDays) {
        el.innerHTML = `${y}年${m}月の所定日数：<strong>${shoteiDays}日</strong>`;
      } else {
        el.innerHTML = `⚠️ この月の所定日数が未設定です。<a href="master_shotnichi.html">所定日数設定</a>から登録してください。`;
      }
    }

    // ===== Excel取り込み =====
    // 「時間管理変換」ファイル（社員ごと・日ごとの出退勤データ）を取り込む。
    // 労働時間がプラスの日だけを「終わった勤務日」として数える。
    // 0の日（休みの日）や、マイナスの日（まだ退勤していない日）は数えないので、
    // 誰かがまだ勤務中でも、他の人のデータは正しく取り込める。
    async function doUpload() {
      if (!canEdit()) { showUploadMsg('閲覧のみモードのため、取り込みはできません', 'err'); return; }
      const file = document.getElementById('kintai-file').files[0];
      if (!file) { showUploadMsg('ファイルを選んでください', 'err'); return; }

      showUploadMsg('取り込み中…', 'ok');
      try {
        const buf = await file.arrayBuffer();
        const wb = new ExcelJS.Workbook();
        await wb.xlsx.load(buf);
        const sheet = wb.getWorksheet('時間管理変換結果') || wb.worksheets[0];
        if (!sheet) throw new Error('シートが見つかりません');

        // Excelの日付・時刻は「1899-12-30」からの経過時間として保存されているので、
        // そこからの経過時間（時間の小数）に変換する。数式のセルは{formula, result}の
        // 形で値が入っているので、resultを取り出す。
        const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
        function cellVal(v) {
          if (v && typeof v === 'object' && 'result' in v) return v.result;
          return v;
        }
        function toHours(v) {
          const val = cellVal(v);
          if (val == null) return null;
          const d = val instanceof Date ? val : new Date(val);
          if (isNaN(d.getTime())) return null;
          return (d.getTime() - EXCEL_EPOCH) / 3600000;
        }

        // 1行目D列：対象年月（例：2026-07-01）
        const row1 = sheet.getRow(1).values;
        const monthVal = cellVal(row1[4]);
        if (!monthVal) throw new Error('対象年月が読み取れませんでした。ファイルの形式を確認してください。');
        const md = monthVal instanceof Date ? monthVal : new Date(monthVal);
        const yearmonth = `${md.getUTCFullYear()}${String(md.getUTCMonth() + 1).padStart(2, '0')}`;

        // 今日の実際の日付（この日の分だけ、退勤済みかどうかを別に見る）
        const today = new Date();
        const todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

        // このExcelファイル自体が「いつ保存されたか」を、データ基準日として使う。
        // （ファイルの中身は、月の最後の日まで全員分の行があらかじめ用意されていて、
        //   まだ来ていない日は空欄で埋まっているだけなので、行の日付からは
        //   「実際どこまでのデータか」は分からない。ファイルの保存日時の方が確実。）
        const fileSavedAt = wb.modified || wb.created || new Date();
        const asOfDate = `${fileSavedAt.getFullYear()}-${String(fileSavedAt.getMonth() + 1).padStart(2, '0')}-${String(fileSavedAt.getDate()).padStart(2, '0')}`;

        // 3行目以降：社員ごと・日ごとのデータ（C列=社員CD、E列=日付、J列=労働時間）
        const totals = new Map(); // staff_code -> { work_days, work_hours, overtime_hours, today_done }
        sheet.eachRow((row, rowNumber) => {
          if (rowNumber < 3) return;
          const v = row.values;
          const staffCode = String(cellVal(v[3]) ?? '').trim();
          if (!staffCode) return;
          if (!totals.has(staffCode)) totals.set(staffCode, { work_days: 0, work_hours: 0, overtime_hours: 0, today_done: null });
          const t = totals.get(staffCode);

          // この行が「今日」の分であれば、退勤済みかどうかを記録しておく
          // （残り日数を計算するときに、今日をもう含めなくてよいか判断するため）
          const dateVal = cellVal(v[5]);
          const d = dateVal instanceof Date ? dateVal : (dateVal ? new Date(dateVal) : null);
          const hoursForFlag = toHours(v[10]);
          if (d && d.getUTCFullYear() === todayY && d.getUTCMonth() === todayM && d.getUTCDate() === todayD) {
            t.today_done = hoursForFlag != null && hoursForFlag > 0;
          }

          const hours = hoursForFlag; // 労働時間
          if (hours == null || hours <= 0) return; // 休みの日・まだ退勤していない日は数えない
          t.work_days += 1;
          t.work_hours += hours;
          t.overtime_hours += Math.max(0, hours - 8); // 1日8時間を超えた分を残業として計算する
        });

        if (totals.size === 0) throw new Error('取り込めるデータが0件でした。ファイルの形式を確認してください。');

        const records = [...totals.entries()].map(([staff_code, t]) => ({
          staff_code,
          yearmonth,
          work_days: t.work_days,
          work_hours: Math.round(t.work_hours * 100) / 100,
          overtime_hours: Math.round(t.overtime_hours * 100) / 100,
          today_done: t.today_done,
          as_of_date: asOfDate,
        }));

        // このファイルに載っている社員の分だけを消してから、新しく入れ直す。
        // （その年月を全員分消してしまうと、他の部署の人が別のタイミングで
        //   取り込んだデータまで消えてしまうため、対象の社員だけに絞る）
        const staffCodesInFile = records.map(r => r.staff_code);
        const { error: delErr } = await sb.from('shift_kintai')
          .delete().eq('yearmonth', yearmonth).in('staff_code', staffCodesInFile);
        if (delErr) throw delErr;

        const { error } = await sb.from('shift_kintai').insert(records);
        if (error) throw error;

        showUploadMsg(`✅ ${records.length}件のデータを取り込みました`, 'ok');

        // 取り込んだ月が選択中の月であれば、表を更新
        if (yearmonth !== currentYM) {
          document.getElementById('ym-sel').value = yearmonth;
        }
        await loadData();
      } catch (e) {
        console.error(e);
        showUploadMsg('❌ 取り込みに失敗しました: ' + e.message, 'err');
      }
    }

    function showUploadMsg(text, type) {
      const el = document.getElementById('upload-msg');
      el.textContent = text;
      el.className = 'upload-msg ' + type;
    }

    // 業務シフトを見て、「データ基準日から月末までに実際に働く予定の日数」を数える。
    // 実際の今日の日付ではなく、取り込んだデータの基準日（asOfDate）を基準にする。
    // （データ基準日が実際の今日より前のことがあるため、実際の今日を基準にすると
    //   ずれてしまう。データ基準日が無い古いデータの場合だけ、実際の今日で代用する）
    // 休日(900/901)・有休(902)・健診(903)などの900番台は数えない。
    // データ基準日の時点ですでに退勤済み（todayDone=true）であれば、その日は含めず翌日から数える。
    // まだ退勤していない（todayDone=falseまたは不明）場合は、その日もこれから働く日として数える。
    function countRemainingShiftDays(staffCode, ym, todayDone, asOfDate) {
      const shift = gyomuShiftMap[staffCode];
      if (!shift) return null; // 業務シフトが登録されていない

      const y = parseInt(ym.slice(0, 4));
      const m = parseInt(ym.slice(4, 6));
      const lastDay = new Date(y, m, 0).getDate();

      const refDate = asOfDate ? new Date(asOfDate + 'T00:00:00') : new Date();
      const refYm = `${refDate.getFullYear()}${String(refDate.getMonth() + 1).padStart(2, '0')}`;

      let startDay;
      if (ym < refYm) return 0;       // すでに終わった月
      else if (ym > refYm) startDay = 1; // まだ来ていない月は1日から
      else startDay = todayDone ? refDate.getDate() + 1 : refDate.getDate(); // 基準日に退勤済みなら翌日から

      let count = 0;
      for (let d = startDay; d <= lastDay; d++) {
        const key = `d${String(d).padStart(2, '0')}`;
        const val = shift[key];
        // シフトが空欄（未入力）の日は、休日ではなく勤務日として1日にカウントする
        if (!val) { count++; continue; }
        const codeNum = parseInt(val, 10);
        const isKyujitsu = !isNaN(codeNum) && codeNum >= 900; // 休日・有休・健診など
        if (!isKyujitsu) count++;
      }
      return count;
    }

    // 所属マスタから「休日」という名前の900番台コードを探す（有休・健診・講習などは対象外）
    function getHolidayBushoCode() {
      const b = (masters.bushos || []).find(x => /^9\d*$/.test(String(x.busho_code)) && x.busho_name === '休日');
      return b ? b.busho_code : null;
    }

    // 業務シフトを見て、その月まるごとの「勤務予定日数」を数える。
    // 休日は除外し、有休・健診・講習などは勤務日数として数える（勤務日数の考え方と同じ）。
    // シフトが空欄（未入力）の日はカウントしない。
    function countScheduledWorkDays(staffCode, ym) {
      const shift = gyomuShiftMap[staffCode];
      if (!shift) return null; // 業務シフトが登録されていない

      const y = parseInt(ym.slice(0, 4));
      const m = parseInt(ym.slice(4, 6));
      const lastDay = new Date(y, m, 0).getDate();
      const holidayCode = getHolidayBushoCode();

      let count = 0;
      for (let d = 1; d <= lastDay; d++) {
        const key = `d${String(d).padStart(2, '0')}`;
        const val = shift[key];
        if (!val) continue; // 空欄はカウントしない
        if (holidayCode && String(val) === String(holidayCode)) continue; // 休日は除外
        count++;
      }
      return count;
    }

    // ===== テーブル描画 =====
    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      // 印刷したときに、画面の月・所属の絞り込みが分かるようにタイトルを入れておく
      const y = currentYM.substring(0, 4), m = currentYM.substring(4, 6);
      const filterName = currentFilter.size > 0
        ? [...currentFilter].map(c => masters.bushoMap[c]?.busho_name || c).join('・')
        : '全員';
      document.getElementById('print-title').textContent = `勤怠管理　${y}年${m}月（${filterName}）`;

      const kintaiMap = Object.fromEntries(kintaiRows.map(r => [r.staff_code, r]));
      let targetStaffs = masters.staffs.filter(s => !s.retired);
      if (currentFilter.size > 0) targetStaffs = targetStaffs.filter(s => currentFilter.has(s.busho_code));

      // まず、表示に必要な数字をすべて計算しておく（並び替えのため）
      const rows = targetStaffs.map(staff => {
        const k = kintaiMap[staff.staff_code];
        const busho = masters.bushoMap[staff.busho_code];
        const overLimit = staff.overtime_limit || 60;
        const jougenJikan = shoteiDays ? shoteiDays * 8 + overLimit : null;

        const workDays = k ? k.work_days : null;
        const workHours = k ? k.work_hours : null;
        const overHours = k ? k.overtime_hours : null;

        // 勤務予定日数は、業務シフトを見てその月まるごと「働く予定の日数」を数える
        // （休日は除く。有休・健診・講習などは勤務日数として数える）
        const yoteiNissu = countScheduledWorkDays(staff.staff_code, currentYM);

        const nokoriJikan = (jougenJikan !== null && workHours !== null) ? jougenJikan - workHours : null;
        // 残り日数は、業務シフトを見て「今日から月末までに実際に働く予定の日数」を数える
        // （休日・有休・健診は除く）。業務シフトが登録されていなければ計算できない。
        const nokoriNissu = countRemainingShiftDays(staff.staff_code, currentYM, k?.today_done, k?.as_of_date);
        const hitsuyoJikan = (nokoriJikan !== null && nokoriNissu) ? nokoriJikan / nokoriNissu : null;
        const nenkanZangyo = window.__nenkanZangyo[staff.staff_code] || 0;
        const asOfDate = k ? k.as_of_date : null;

        return { staff, busho, overLimit, jougenJikan, workDays, yoteiNissu, workHours, overHours, nokoriJikan, nokoriNissu, hitsuyoJikan, nenkanZangyo, asOfDate };
      });

      // 並び替えボタンが押されていれば、その項目で並び替える
      if (sortKey) {
        rows.sort((a, b) => compareNullable(a[sortKey], b[sortKey], sortDir));
      }

      rows.forEach(({ staff, busho, overLimit, jougenJikan, workDays, yoteiNissu, workHours, overHours, nokoriJikan, nokoriNissu, hitsuyoJikan, nenkanZangyo, asOfDate }) => {
        const bushoHtml = busho
          ? `<span class="badge" style="background:${busho.color_h};color:${getTextColor(busho.color_h)}">${busho.busho_name}</span>`
          : '－';

        // データ基準日は「7/27」のように月日だけで表示する
        const asOfHtml = asOfDate ? asOfDate.slice(5).replace('-', '/') : '－';

        // 勤務予定日数が所定日数より少なければ、目立つように赤くする
        const yoteiHtml = yoteiNissu == null ? '<span class="na">－</span>'
          : (shoteiDays != null && yoteiNissu < shoteiDays) ? `<span class="over">${yoteiNissu}</span>`
          : yoteiNissu;

        const zangyoRate = overHours && overLimit ? (overHours / overLimit * 100) : 0;
        const overHtml = overHours == null ? '－'
          : zangyoRate >= 100 ? `<span class="over">${overHours.toFixed(2)}</span>`
          : zangyoRate >= 80 ? `<span class="warn">${overHours.toFixed(2)}</span>`
          : overHours.toFixed(2);

        const nokoriHtml = nokoriJikan == null ? '<span class="na">－</span>' : nokoriJikan.toFixed(2);

        // 1日あたりは、残り時間を残り日数で割った「1日にどれだけ働ける余裕があるか」の数字なので、
        // 数字が基準時間より小さいほど余裕がなく危ない（大きいほど余裕がある）。
        // 基準時間を下回ったら、セルではなく行全体を赤くして目立たせる
        const isKijunUnder = hitsuyoJikan != null && hitsuyoJikan < hitsuyoKijun;
        const hitsuyoHtml = hitsuyoJikan == null ? '<span class="na">－</span>' : hitsuyoJikan.toFixed(2);

        const nenkanHtml = nenkanZangyo >= 360 ? `<span class="over">${nenkanZangyo.toFixed(1)}</span>`
          : nenkanZangyo >= 300 ? `<span class="warn">${nenkanZangyo.toFixed(1)}</span>`
          : nenkanZangyo.toFixed(1);

        const tr = document.createElement('tr');
        if (isKijunUnder) tr.classList.add('row-danger');
        tr.innerHTML = `
          <td>${staff.staff_code}</td>
          <td style="text-align:left;">${staff.name}</td>
          <td>${bushoHtml}</td>
          <td>${workDays ?? '－'}</td>
          <td>${yoteiHtml}</td>
          <td>${workHours != null ? workHours.toFixed(2) : '－'}</td>
          <td>${overHtml}</td>
          <td>${jougenJikan ?? '－'}</td>
          <td>${nokoriHtml}</td>
          <td>${nokoriNissu ?? '－'}</td>
          <td>${hitsuyoHtml}</td>
          <td>${nenkanHtml}</td>
          <td>${asOfHtml}</td>
        `;
        tbody.appendChild(tr);
      });

      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" style="color:#aaa;padding:20px;">対象の社員がいません</td></tr>`;
      }

      updateSortHeaders();
    }

    init();
  </script>
