<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健診・有給管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0 auto; padding: 10px; background: #f5f5f5; max-width: 760px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 10px 0; }
    h2 { font-size: 1rem; margin: 18px 0 8px; }
    .back { display: block; text-align: center; margin: 8px 0; color: #4a90e2; text-decoration: none; width: fit-content; margin-left: auto; margin-right: auto; }
    .desc { background: #e8f4fd; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.85rem; }
    .sticky-header { position: sticky; top: 0; z-index: 20; background: #f5f5f5; padding-top: 2px; padding-bottom: 6px; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 8px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }

    .form-box { background: #fff0e8; border-radius: 8px; padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .form-table { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
    .form-cell { display: block; }
    .form-cell label { display: block; font-size: 0.75rem; color: #666; text-align: center; margin-bottom: 3px; }
    .form-cell input, .form-cell select {
      width: 100%; font-size: 0.85rem; padding: 4px 2px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    button { font-size: 0.85rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-add    { background: #4a90e2; }
    .btn-delete { background: #e74c3c; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-size: 0.85rem; table-layout: fixed; margin-bottom: 16px; }
    th { background: #eee; padding: 7px 4px; text-align: center; border-bottom: 1px solid #ddd; }
    td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #f0f8ff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-del-row { background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 3px 10px; cursor: pointer; font-size: 0.78rem; }
    .empty-msg { text-align: center; padding: 20px; color: #aaa; }
  </style>
</head>
<body>

  <div class="desc">
    📋 社員ごとに「健診を受けた日」「有給を取った日」を登録します。健診は、前回から1年近くたつと一覧の上に表示してお知らせします。有給は、年度（4月始まり）ごとの残り日数を計算します。
  </div>

  <div class="sticky-header">
  <h1>🩺 健診・有給管理</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>
  <!-- 入力フォーム -->
  <div class="form-box">
    <div class="form-table">
      <div class="form-cell" style="width:160px">
        <label>社員</label>
        <select id="f_staff"><option value="">-- 選択 --</option></select>
      </div>
      <div class="form-cell" style="width:110px">
        <label>種別</label>
        <select id="f_category">
          <option value="健診">健診</option>
          <option value="有給">有給</option>
        </select>
      </div>
      <div class="form-cell" style="width:150px">
        <label>日付</label>
        <input type="date" id="f_date">
      </div>
      <div class="form-cell" style="width:160px">
        <label>メモ（任意）</label>
        <input type="text" id="f_memo" placeholder="例：人間ドック">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add" onclick="addRow()">登録</button>
    </div>
  </div>
  </div>

  <div id="loading" class="loading">読み込み中...</div>
  <div id="main-content" style="display:none">

    <h2>⚠️ 健診の期限が近い・過ぎている人</h2>
    <table>
      <thead>
        <tr><th>氏名</th><th>前回の健診日</th><th style="width:120px">状態</th></tr>
      </thead>
      <tbody id="kenko-alert-tbody"></tbody>
    </table>

    <h2>🌴 有給の残り日数（今年度：<span id="nendo-label"></span>）</h2>
    <table>
      <thead>
        <tr><th>氏名</th><th style="width:90px">付与日数</th><th style="width:90px">使用日数</th><th style="width:90px">残り</th></tr>
      </thead>
      <tbody id="yukyu-tbody"></tbody>
    </table>

    <h2>📑 登録一覧</h2>
    <table>
      <thead>
        <tr>
          <th style="width:100px">日付</th>
          <th>氏名</th>
          <th style="width:70px">種別</th>
          <th>メモ</th>
          <th style="width:70px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let rows = [];
    let activeStaffs = [];

    async function init() {
      masters = await loadMasters();
      activeStaffs = masters.staffs.filter(s => !s.retired).sort((a, b) => a.staff_code.localeCompare(b.staff_code));
      buildStaffSelect();
      lockMasterFormIfNeeded();
      await loadRows();
    }

    function buildStaffSelect() {
      const sel = document.getElementById('f_staff');
      activeStaffs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.staff_code;
        opt.textContent = s.name || s.staff_code;
        sel.appendChild(opt);
      });
    }

    // 日付入力（yyyy-mm-dd）→ 盤面と同じ形式（yyyymmdd）に変換
    function toDateStr(v) { return (v || '').replaceAll('-', ''); }
    function formatDateLabel(v) {
      if (!v || v.length !== 8) return v || '－';
      return `${v.slice(0,4)}年${parseInt(v.slice(4,6))}月${parseInt(v.slice(6,8))}日`;
    }
    // YYYYMMDD文字列をDateオブジェクトに（日数計算用）
    function toDateObj(v) {
      if (!v || v.length !== 8) return null;
      return new Date(parseInt(v.slice(0,4)), parseInt(v.slice(4,6)) - 1, parseInt(v.slice(6,8)));
    }
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }

    // 今年度（4月始まり）の開始日・終了日を求める
    function getNendoRange() {
      const now = new Date();
      const y = now.getFullYear();
      const startYear = now.getMonth() >= 3 ? y : y - 1; // 1〜3月は前の年度扱い
      const start = `${startYear}0401`;
      const end = `${startYear + 1}0331`;
      return { start, end, label: `${startYear}年4月〜${startYear+1}年3月` };
    }

    async function loadRows() {
      const { data, error } = await sb.from('shift_kenko_yukyu').select('*').order('date', { ascending: false });
      if (error) { showMsg('データの読み込みに失敗しました: ' + error.message, 'err'); return; }
      rows = data || [];
      renderAll();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = '';
    }

    function renderAll() {
      renderKenkoAlert();
      renderYukyu();
      renderTable();
    }

    // ===== 健診の期限アラート =====
    function renderKenkoAlert() {
      const tbody = document.getElementById('kenko-alert-tbody');
      tbody.innerHTML = '';
      const today = new Date();
      const list = [];

      activeStaffs.forEach(s => {
        const kenkoRows = rows.filter(r => r.staff_code === s.staff_code && r.category === '健診');
        const latest = kenkoRows.length ? kenkoRows.reduce((a, b) => a.date > b.date ? a : b) : null;
        let statusLabel, statusColor, sortKey;
        if (!latest) {
          statusLabel = '未登録';
          statusColor = { bg: '#eee', col: '#888' };
          sortKey = -99999; // 未登録は最優先で上に出す
        } else {
          const lastDate = toDateObj(latest.date);
          const dueDate = new Date(lastDate);
          dueDate.setFullYear(dueDate.getFullYear() + 1); // 健診は1年ごとの前提
          const diffDays = Math.round((dueDate - today) / (1000 * 60 * 60 * 24));
          sortKey = diffDays;
          if (diffDays < 0) {
            statusLabel = `期限切れ（${Math.abs(diffDays)}日超過）`;
            statusColor = { bg: '#fdecea', col: '#c0392b' };
          } else if (diffDays <= 30) {
            statusLabel = `あと${diffDays}日`;
            statusColor = { bg: '#fdf3cf', col: '#8a6d1d' };
          } else {
            return; // まだ先の人は一覧に出さない
          }
        }
        list.push({ name: s.name || s.staff_code, lastDateLabel: latest ? formatDateLabel(latest.date) : '－', statusLabel, statusColor, sortKey });
      });

      list.sort((a, b) => a.sortKey - b.sortKey);

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">対象者はいません</td></tr>';
        return;
      }
      list.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>${item.lastDateLabel}</td>
          <td><span class="badge" style="background:${item.statusColor.bg};color:${item.statusColor.col}">${item.statusLabel}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ===== 有給の残り日数 =====
    function renderYukyu() {
      const { start, end, label } = getNendoRange();
      document.getElementById('nendo-label').textContent = label;
      const tbody = document.getElementById('yukyu-tbody');
      tbody.innerHTML = '';

      activeStaffs.forEach(s => {
        const used = rows.filter(r => r.staff_code === s.staff_code && r.category === '有給' && r.date >= start && r.date <= end).length;
        const granted = s.paid_leave_days;
        const tr = document.createElement('tr');
        if (granted == null) {
          tr.innerHTML = `
            <td>${s.name || s.staff_code}</td>
            <td><span class="badge" style="background:#eee;color:#888">未設定</span></td>
            <td>${used}日</td>
            <td>－</td>
          `;
        } else {
          const remain = granted - used;
          const remainColor = remain < 0 ? { bg: '#fdecea', col: '#c0392b' } : { bg: '#d4edda', col: '#155724' };
          tr.innerHTML = `
            <td>${s.name || s.staff_code}</td>
            <td>${granted}日</td>
            <td>${used}日</td>
            <td><span class="badge" style="background:${remainColor.bg};color:${remainColor.col}">${remain}日</span></td>
          `;
        }
        tbody.appendChild(tr);
      });
      const note = document.createElement('tr');
      note.innerHTML = `<td colspan="4" style="font-size:0.75rem;color:#888;text-align:left;padding:6px 10px;">💡 「付与日数」が未設定の人は、社員マスタで設定してください。</td>`;
      tbody.appendChild(note);
    }

    // ===== 登録一覧 =====
    const CATEGORY_COLOR = { '健診': { bg: '#d6eaf8', col: '#1a5276' }, '有給': { bg: '#e8f8e8', col: '#1e7a1e' } };

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">登録はありません</td></tr>';
        return;
      }
      rows.forEach(r => {
        const staff = masters.staffMap[r.staff_code];
        const c = CATEGORY_COLOR[r.category] || { bg: '#eee', col: '#555' };
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDateLabel(r.date)}</td>
          <td>${staff ? (staff.name || staff.staff_code) : r.staff_code}</td>
          <td><span class="badge" style="background:${c.bg};color:${c.col}">${r.category}</span></td>
          <td>${r.memo || ''}</td>
          <td><button class="btn-del-row" onclick="deleteRow(${r.id})">削除</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function addRow() {
      if (!canEdit()) { showMsg('閲覧のみモードのため登録できません', 'err'); return; }
      const staffCode = document.getElementById('f_staff').value;
      const category = document.getElementById('f_category').value;
      const dateStr = toDateStr(document.getElementById('f_date').value);
      const memo = document.getElementById('f_memo').value.trim();
      if (!staffCode) { showMsg('社員を選んでください', 'err'); return; }
      if (!dateStr) { showMsg('日付を選んでください', 'err'); return; }

      const { error } = await sb.from('shift_kenko_yukyu').insert({ staff_code: staffCode, category, date: dateStr, memo: memo || null });
      if (error) { showMsg('登録に失敗しました: ' + error.message, 'err'); return; }
      const staff = masters.staffMap[staffCode];
      logChange('健診・有給管理', '追加', `社員「${staff ? (staff.name || staffCode) : staffCode}」${category} ${formatDateLabel(dateStr)}`, memo || null);
      showMsg('登録しました', 'ok');
      document.getElementById('f_memo').value = '';
      await loadRows();
    }

    async function deleteRow(id) {
      if (!canEdit()) { showMsg('閲覧のみモードのため削除できません', 'err'); return; }
      if (!confirm('この登録を削除しますか？')) return;
      const target = rows.find(r => r.id === id);
      const { error } = await sb.from('shift_kenko_yukyu').delete().eq('id', id);
      if (error) { showMsg('削除に失敗しました: ' + error.message, 'err'); return; }
      if (target) {
        const staff = masters.staffMap[target.staff_code];
        logChange('健診・有給管理', '削除', `社員「${staff ? (staff.name || target.staff_code) : target.staff_code}」${target.category} ${formatDateLabel(target.date)}`);
      }
      showMsg('削除しました', 'ok');
      await loadRows();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    init();
  </script>
</body>
</html>
