<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト管理システム</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0 auto; padding: 20px; background: #f5f5f5; max-width: 860px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .title-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 24px; flex-wrap: wrap; }
    .btn-manual {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 14px; border-radius: 6px; text-decoration: none;
      background: #34495e; color: white; font-size: 0.82rem; font-weight: bold;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .btn-manual:hover { opacity: 0.85; }
    .section { margin-bottom: 20px; }
    .section-title {
      font-size: 0.85rem; color: #555; font-weight: bold;
      border-left: 4px solid #ccc; padding-left: 8px; margin-bottom: 10px;
    }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    a.menu-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 18px 10px; border-radius: 8px; text-decoration: none;
      color: white; font-size: 1rem; font-weight: bold;
      text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: opacity 0.15s;
    }
    a.menu-btn:hover { opacity: 0.85; }
    /* 色の考え方：同じ分類（シフト・運用・適性・マスタ）は同じ系統の色でそろえ、
       その中で少しだけ濃淡を変えて見分けやすくしています */
    .c-master   { background: #d4a017; } /* 🗂️ マスタ＝黄色系 */
    .c-import   { background: #b8860b; } /* 🗂️ マスタ＝黄色系（少し濃いめ） */
    .c-config   { background: #505050; } /* ⚙️ 設定系（運用の中の設定項目）＝グレー */
    .c-tekisei  { background: #16a085; } /* ✅ 適性＝緑系 */
    .c-shift    { background: #c0392b; } /* 📋 シフト＝赤系 */
    .c-banmen   { background: #2980b9; } /* 🖥️ 運用＝青系 */
    .c-oen      { background: #3498db; } /* 🖥️ 運用＝青系 */
    .c-haken    { background: #1f618d; } /* 🖥️ 運用＝青系 */
    .c-kintai   { background: #1a5276; } /* 🖥️ 運用＝青系 */
    .c-parking  { background: #2471a3; } /* 🖥️ 運用＝青系 */
    .c-carstatus{ background: #5499c7; } /* 🖥️ 運用＝青系 */
    .c-login    { background: #34495e; } /* ログイン（単独ボタン） */
    @media (max-width: 768px) {
      .pc-only { display: none; }
      .sp-show { display: block; }
    }
    @media (min-width: 769px) {
      .sp-show { display: none; }
    }
  </style>
</head>
<body>
  <div class="title-row">
    <h1>📅 シフト管理システム</h1>
    <a class="btn-manual" href="manual.pdf" target="_blank">📖 マニュアル</a>
  </div>

  <!-- ログインしていない人向け：簡易メニュー -->
  <div id="guest-view">
    <div class="section">
      <div class="section-title">🖥️ 運用</div>
      <div class="btn-grid">
        <a href="banmen.html" class="menu-btn c-banmen">盤面</a>
        <a href="shift_gyoumu.html" class="menu-btn c-shift">業務シフト</a>
        <a href="chusyajo.html" class="menu-btn c-parking">🅿️ 駐車場状況</a>
        <a href="login.html" class="menu-btn c-login">🔐 ログイン</a>
      </div>
    </div>
  </div>

  <!-- ログイン済みの人向け：すべてのメニュー -->
  <div id="full-view" style="display:none">

  <!-- スマホ専用メニュー -->
  <div class="section sp-show">
    <div class="section-title">🖥️ 運用</div>
    <div class="btn-grid">
      <a href="banmen.html" class="menu-btn c-banmen">盤面</a>
      <a href="shift_gyoumu.html" class="menu-btn c-shift">業務シフト</a>
      <a href="chusyajo.html" class="menu-btn c-parking">🅿️ 駐車場状況</a>
    </div>
  </div>

  <!-- PC用メニュー -->
  <div class="section pc-only">
    <div class="section-title">📋 シフト</div>
    <div class="btn-grid">
      <a href="base_gyomu.html" class="menu-btn c-shift">ベース業務</a>
      <a href="shift_gyoumu.html" class="menu-btn c-shift">業務シフト</a>
    </div>
  </div>

  <div class="section pc-only">
    <div class="section-title">🖥️ 運用</div>
    <div class="btn-grid">
      <a href="banmen.html" class="menu-btn c-banmen">盤面</a>
      <a href="banmen_config.html" class="menu-btn c-config">盤面設定</a>
      <a href="car_status.html" class="menu-btn c-carstatus">🚗 車両使用状況</a>
      <a href="master_car_quota.html" class="menu-btn c-config">必要台数</a>
      <a href="oen.html" class="menu-btn c-oen">応援一覧</a>
      <a href="chusyajo.html" class="menu-btn c-parking">🅿️ 駐車場状況</a>
      <a href="haken_total.html" class="menu-btn c-haken">派遣集計</a>
      <a href="kintai.html" class="menu-btn c-kintai">勤怠管理</a>
      <a href="change_history.html" class="menu-btn c-config">🕘 変更履歴</a>
    </div>
  </div>

  <div class="section pc-only">
    <div class="section-title">✅ 適性</div>
    <div class="btn-grid">
      <a href="syozoku_tekisei.html" class="menu-btn c-tekisei">所属適性</a>
      <a href="gyomu_tekisei.html" class="menu-btn c-tekisei">業務適性</a>
    </div>
  </div>

  <div class="section pc-only">
    <div class="section-title">🗂️ マスタ</div>
    <div class="btn-grid">
      <a href="master_staff.html" class="menu-btn c-master">社員</a>
      <a href="master_busho.html" class="menu-btn c-master">所属</a>
      <a href="master_gyomu.html" class="menu-btn c-master">業務</a>
      <a href="master_car.html" class="menu-btn c-master">車両管理</a>
      <a href="master_syaken.html" class="menu-btn c-master">車検・修理管理</a>
      <a href="master_haken.html" class="menu-btn c-master">派遣会社</a>
      <a href="master_special_holiday.html" class="menu-btn c-master">特別休業日</a>
      <a href="master_shotnichi.html" class="menu-btn c-master">月間所定日数</a>
      <a href="master_chusyajo.html" class="menu-btn c-master">駐車場</a>
      <a href="import.html" class="menu-btn c-import">データインポート</a>
    </div>
  </div>

  </div><!-- /full-view -->

  <script>
    // ログインしているかどうかで、見せる画面を切り替える
    if (typeof getAuth === 'function' && getAuth()) {
      document.getElementById('guest-view').style.display = 'none';
      document.getElementById('full-view').style.display = '';
    }
  </script>
</body>
</html>
