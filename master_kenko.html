<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健診管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0 auto; padding: 10px; background: #f5f5f5; max-width: 700px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 10px 0; }
    h2 { font-size: 1rem; margin: 18px 0 8px; }
    .back { display: block; text-align: center; margin: 8px 0; color: #4a90e2; text-decoration: none; width: fit-content; margin-left: auto; margin-right: auto; }
    .desc { background: #e8f4fd; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.85rem; }
    .sticky-header { position: sticky; top: 0; z-index: 20; background: #f5f5f5; padding-top: 2px; padding-bottom: 6px; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 8px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .filter-btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; }

    .form-box { background: #e8f4fd; border-radius: 8px; padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .form-table { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
    .form-cell { display: block; }
    .form-cell label { display: block; font-size: 0.75rem; color: #666; text-align: center; margin-bottom: 3px; }
    .form-cell input, .form-cell select {
      width: 100%; font-size: 0.85rem; padding: 4px 2px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    button { font-size: 0.85rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-add    { background: #4a90e2; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-size: 0.85rem; table-layout: fixed; margin-bottom: 16px; }
    th { background: #eee; padding: 7px 4px; text-align: center; border-bottom: 1px solid #ddd; }
    td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tr:hover td { background: #f0f8ff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-del-row { background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 3px 10px; cursor: pointer; font-size: 0.78rem; }
    .empty-msg { text-align: center; padding: 20px; color: #aaa; }
  </style>
</head>
<body>

  <div class="desc">
    🩺 社員ごとに健診日を登録します。登録した日がまだ来ていなければ「今回の健診日」として表示し、その日を過ぎると自動で「前回の健診日」に変わります。日が過ぎたあと、次の健診日が決まったら、新しく登録してください。
  </div>

  <div class="sticky-header">
  <h1>🩺 健診管理</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>
  <!-- 所属フィルター -->
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" style="background:#555;color:white" onclick="filterByBusho('',this)">全員</button>
  </div>
  <!-- 入力フォーム -->
  <div class="form-box">
    <div class="form-table">
      <div class="form-cell" style="width:160px">
        <label>社員</label>
        <select id="f_staff" onchange="onStaffChange()"><option value="">-- 選択 --</option></select>
      </div>
      <div class="form-cell" style="width:150px">
        <label>健診日</label>
        <input type="date" id="f_date">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add" onclick="addRow()">登録</button>
    </div>
  </div>
  </div>

  <div id="loading" class="loading">読み込み中...</div>
  <div id="main-content" style="display:none">

    <h2 style="display:flex;align-items:center;gap:10px;">
      🩺 健診状況一覧
      <button id="btn-missing-only" onclick="toggleMissingOnly()" style="background:#e74c3c;font-size:0.75rem;padding:4px 10px;">未登録のみ表示</button>
    </h2>
    <table>
      <thead>
        <tr><th>氏名</th><th style="width:140px">前回の健診日</th><th style="width:140px">今回の健診日</th></tr>
      </thead>
      <tbody id="kenko-alert-tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let rows = [];
    let activeStaffs = [];
    let currentFilter = '';
    let showMissingOnly = false;

    function toggleMissingOnly() {
      showMissingOnly = !showMissingOnly;
      const btn = document.getElementById('btn-missing-only');
      btn.style.outline = showMissingOnly ? '3px solid #333' : '';
      btn.textContent = showMissingOnly ? '全員を表示' : '未登録のみ表示';
      renderAll();
    }

    async function init() {
      masters = await loadMasters();
      activeStaffs = masters.staffs.filter(s => !s.retired).sort((a, b) => a.staff_code.localeCompare(b.staff_code));
      buildFilterButtons();
      buildStaffSelect();
      lockMasterFormIfNeeded();
      await loadRows();
    }

    function buildFilterButtons() {
      const row = document.getElementById('filter-row');
      masters.bushos.filter(b => !b.busho_code.startsWith('9') && !b.is_banmen_only).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = b.color_h;
        btn.style.color = getTextColor(b.color_h);
        btn.textContent = b.busho_name;
        btn.onclick = () => filterByBusho(b.busho_code, btn);
        row.appendChild(btn);
      });
    }

    function filterByBusho(bushoCode, btn) {
      currentFilter = bushoCode;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      else document.querySelector('.filter-btn').classList.add('active');
      renderAll();
    }

    function filteredStaffs() {
      return currentFilter ? activeStaffs.filter(s => s.busho_code === currentFilter) : activeStaffs;
    }

    function buildStaffSelect() {
      const sel = document.getElementById('f_staff');
      activeStaffs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.staff_code;
        opt.textContent = s.name || s.staff_code;
        sel.appendChild(opt);
      });
    }

    function pickStaffToForm(staffCode) {
      document.getElementById('f_staff').value = staffCode;
      onStaffChange();
    }

    function toDateStr(v) { return (v || '').replaceAll('-', ''); }
    function formatDateLabel(v) {
      if (!v || v.length !== 8) return v || '－';
      return `${v.slice(0,4)}年${parseInt(v.slice(4,6))}月${parseInt(v.slice(6,8))}日`;
    }
    function toDateObj(v) {
      if (!v || v.length !== 8) return null;
      return new Date(parseInt(v.slice(0,4)), parseInt(v.slice(4,6)) - 1, parseInt(v.slice(6,8)));
    }
    // 今日の日付を、登録データと同じYYYYMMDD形式の文字列にする（文字列同士の大小比較で前後が分かる）
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }
    // YYYYMMDD → <input type=date>に入れられるYYYY-MM-DD
    function toInputDateValue(v) {
      if (!v || v.length !== 8) return '';
      return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
    }

    // ある社員の「前回の健診日」「今回の健診日」を求める。
    // 今回＝まだ来ていない日の中で一番近いもの、前回＝すでに過ぎた日の中で一番新しいもの
    // （同じ日が重複登録されていても、正しく判定できるようにする）
    function getKenkoStatus(staffCode) {
      const today = todayStr();
      const kenkoRows = rows.filter(r => r.staff_code === staffCode);
      const futureDates = kenkoRows.filter(r => r.date >= today).map(r => r.date).sort();
      const pastDates = kenkoRows.filter(r => r.date < today).map(r => r.date).sort();
      return {
        nextDate: futureDates.length ? futureDates[0] : null,
        prevDate: pastDates.length ? pastDates[pastDates.length - 1] : null,
      };
    }

    // 社員を選んだときに、その人の「今回の健診日」があれば自動で日付欄に入れる（なければ空欄のまま）
    function onStaffChange() {
      const staffCode = document.getElementById('f_staff').value;
      const dateInput = document.getElementById('f_date');
      if (!staffCode) { dateInput.value = ''; return; }
      const { nextDate } = getKenkoStatus(staffCode);
      dateInput.value = nextDate ? toInputDateValue(nextDate) : '';
    }

    async function loadRows() {
      const { data, error } = await sb.from('shift_kenko_yukyu').select('*').eq('category', '健診').order('date', { ascending: false });
      if (error) { showMsg('データの読み込みに失敗しました: ' + error.message, 'err'); return; }
      rows = data || [];
      renderAll();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = '';
    }

    function renderAll() {
      renderKenkoAlert();
    }

    // ===== 健診状況一覧 =====
    // 社員ごとに、「今回の健診日」（まだ来ていない日の中で一番近いもの）と
    // 「前回の健診日」（すでに過ぎた日の中で一番新しいもの）を求めて表示する。
    function renderKenkoAlert() {
      const tbody = document.getElementById('kenko-alert-tbody');
      tbody.innerHTML = '';
      const today = todayStr();
      const list = [];

      filteredStaffs().forEach(s => {
        const { nextDate, prevDate } = getKenkoStatus(s.staff_code);
        const isMissing = !nextDate;
        let statusColor, sortKey;
        if (isMissing) {
          sortKey = 999999; // 今回の健診日が未登録の人は、一覧の一番下に出す
          statusColor = { bg: '#eee', col: '#888' };
        } else {
          const diffDays = Math.round((toDateObj(nextDate) - toDateObj(today)) / (1000 * 60 * 60 * 24));
          sortKey = diffDays;
          statusColor = diffDays <= 30 ? { bg: '#fdf3cf', col: '#8a6d1d' } : { bg: '#e8f8e8', col: '#1e7a1e' };
        }

        list.push({
          staffCode: s.staff_code,
          name: s.name || s.staff_code,
          prevLabel: prevDate ? formatDateLabel(prevDate) : '－',
          nextLabel: nextDate ? formatDateLabel(nextDate) : '未登録',
          statusColor, sortKey, isMissing,
        });
      });

      const visibleList = showMissingOnly ? list.filter(item => item.isMissing) : list;
      visibleList.sort((a, b) => a.sortKey - b.sortKey);

      if (visibleList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="empty-msg">${showMissingOnly ? '未登録の人はいません' : '対象者はいません'}</td></tr>`;
        return;
      }
      visibleList.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="cursor:pointer" title="押すと、上の登録フォームの「社員」にこの人を入れます">${item.name}</td>
          <td>${item.prevLabel}</td>
          <td><span class="badge" style="background:${item.statusColor.bg};color:${item.statusColor.col}">${item.nextLabel}</span></td>
        `;
        tr.querySelector('td').onclick = () => pickStaffToForm(item.staffCode);
        tbody.appendChild(tr);
      });
    }

    async function addRow() {
      if (!canEdit()) { showMsg('閲覧のみモードのため登録できません', 'err'); return; }
      const staffCode = document.getElementById('f_staff').value;
      const dateStr = toDateStr(document.getElementById('f_date').value);
      if (!staffCode) { showMsg('社員を選んでください', 'err'); return; }
      if (!dateStr) { showMsg('日付を選んでください', 'err'); return; }
      if (rows.some(r => r.staff_code === staffCode && r.date === dateStr)) {
        showMsg('その人・その日はすでに登録されています', 'err');
        return;
      }

      const { error } = await sb.from('shift_kenko_yukyu').insert({ staff_code: staffCode, category: '健診', date: dateStr });
      if (error) { showMsg('登録に失敗しました: ' + error.message, 'err'); return; }
      const staff = masters.staffMap[staffCode];
      logChange('健診管理', '追加', `社員「${staff ? (staff.name || staffCode) : staffCode}」${formatDateLabel(dateStr)}`);

      // 業務シフト・盤面にも、その日「健診」として反映する（901〜904は休み系の所属コードとして
      // もともと業務シフト・盤面が認識する仕組みになっている）
      await syncToGyomuShift(staffCode, dateStr, '903');

      showMsg('登録しました', 'ok');
      await loadRows();
    }

    // 業務シフト（shift_gyomu_shift）の、その日の欄（午前）に、所属コードを書き込む。
    // すでに別の予定が入っている日は、上書きしていいか必ず確認する
    async function syncToGyomuShift(staffCode, dateStr, code) {
      const yearmonth = dateStr.slice(0, 6);
      const col = 'd' + dateStr.slice(6, 8);
      const { data } = await sb.from('shift_gyomu_shift').select(col).eq('yearmonth', yearmonth).eq('staff_code', staffCode).maybeSingle();
      const current = data ? data[col] : null;
      if (current && current !== 'EMPTY' && current !== code) {
        if (!confirm(`この日の業務シフトには、すでに別の予定（${current}）が入っています。\n健診に変更しますか？`)) {
          showMsg('健診は登録しましたが、業務シフトへの反映はスキップしました', 'ok');
          return;
        }
      }
      const { error } = await sb.from('shift_gyomu_shift').upsert(
        { yearmonth, staff_code: staffCode, [col]: code },
        { onConflict: 'yearmonth,staff_code' }
      );
      if (error) { showMsg('業務シフトへの反映に失敗しました: ' + error.message, 'err'); }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    init();
  </script>
</body>
</html>
