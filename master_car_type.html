<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両サイズ・車両タイプマスタ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0 auto; padding: 10px; background: #f5f5f5; max-width: 600px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 10px 0; }
    .back { display: block; text-align: center; margin: 8px 0; color: #4a90e2; text-decoration: none; width: fit-content; margin-left: auto; margin-right: auto; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 8px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }
    .sticky-header { position: sticky; top: 0; z-index: 20; background: #f5f5f5; padding-top: 2px; padding-bottom: 6px; }
    .hint { text-align: center; font-size: 0.75rem; color: #888; margin: 0 0 8px; }

    /* フォーム */
    .form-box { background: #fff0e8; border-radius: 8px; padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .form-table { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
    .form-cell { display: block; }
    .form-cell label { display: block; font-size: 0.75rem; color: #666; text-align: center; margin-bottom: 3px; }
    .form-cell input, .form-cell select {
      width: 100%; font-size: 0.85rem; padding: 4px 2px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    button { font-size: 0.85rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-add    { background: #4a90e2; }
    .btn-update { background: #27ae60; }
    .btn-delete { background: #e74c3c; }

    /* テーブル */
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-size: 0.85rem; table-layout: fixed; }
    th { background: #eee; padding: 7px 4px; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: var(--sticky-offset, 0px); z-index: 15; }
    td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    tr:hover td { background: #f0f8ff; }
    tr.selected td { background: #d0e8ff !important; }
    .loading { text-align: center; padding: 20px; color: #888; }
  </style>
</head>
<body>
  <div class="sticky-header">
  <h1>🚛 車両サイズ・車両タイプマスタ</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>
  <p class="hint">ここで登録した候補が、車両管理画面の「車両サイズ」「車両タイプ」のプルダウンに出てきます<br>略称を入れておくと、盤面の車番の下にはその略称が表示されます（入れなければそのままの名前が出ます）</p>
  <div class="form-box">
    <div class="form-table">
      <div class="form-cell" style="width:140px">
        <label>種別</label>
        <select id="f_kind" onchange="updateAbbrMaxLength()">
          <option value="size">車両サイズ</option>
          <option value="shape">車両タイプ</option>
        </select>
      </div>
      <div class="form-cell">
        <label>候補の名前</label>
        <input type="text" id="f_value" placeholder="例：2t、平車 など">
      </div>
      <div class="form-cell" style="width:110px">
        <label>略称（任意）</label>
        <input type="text" id="f_abbr" maxlength="2" placeholder="サイズ2文字まで">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add"    onclick="saveRow('add')">新規登録</button>
      <button class="btn-update" onclick="saveRow('update')">更新</button>
      <button class="btn-delete" onclick="deleteRow()">削除</button>
    </div>
  </div>
  </div>

  <div id="loading" class="loading">読み込み中...</div>
  <table id="main-table" style="display:none">
    <thead>
      <tr>
        <th style="width:110px">種別</th>
        <th>候補の名前</th>
        <th style="width:90px">略称</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script>
    let rows = [];
    let selectedId = null;
    const KIND_LABEL = { size: '車両サイズ', shape: '車両タイプ' };
    const KIND_ORDER = ['size', 'shape']; // 一覧に出す順番（車両サイズ→車両タイプ）

    async function init() {
      lockMasterFormIfNeeded();
      updateAbbrMaxLength();
      await loadRows();
    }

    // 盤面の車番セルの幅を固定で確保しているため、略称は
    // 「車両サイズ＝2文字まで」「車両タイプ＝1文字まで」に揃える
    function updateAbbrMaxLength() {
      const kind = document.getElementById('f_kind').value;
      const abbrInput = document.getElementById('f_abbr');
      if (kind === 'shape') {
        abbrInput.maxLength = 1;
        abbrInput.placeholder = 'タイプ1文字まで';
      } else {
        abbrInput.maxLength = 2;
        abbrInput.placeholder = 'サイズ2文字まで';
      }
    }

    async function loadRows() {
      const { data, error } = await sb.from('shift_car_type').select('*').order('id');
      if (error) { showMsg('データの読み込みに失敗しました: ' + error.message, 'err'); return; }
      // 種別（車両サイズ→車両タイプ）ごとにまとめる。
      // 車両サイズは数字の小さい順、車両タイプは登録した順（古いものが先）に並べる
      rows = (data || []).slice().sort((a, b) => {
        const kindDiff = KIND_ORDER.indexOf(a.kind) - KIND_ORDER.indexOf(b.kind);
        if (kindDiff !== 0) return kindDiff;
        if (a.kind === 'size') {
          const numDiff = (parseFloat(a.value) || 0) - (parseFloat(b.value) || 0);
          if (numDiff !== 0) return numDiff;
        }
        return a.id - b.id;
      });
      renderTable();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-table').style.display = '';
    }

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        if (r.id === selectedId) tr.classList.add('selected');
        tr.onclick = () => selectRow(r);
        tr.innerHTML = `
          <td>${KIND_LABEL[r.kind] || r.kind}</td>
          <td style="text-align:left;padding-left:10px">${r.value || ''}</td>
          <td>${r.abbr || '－'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function selectRow(r) {
      selectedId = r.id;
      document.getElementById('f_kind').value  = r.kind;
      updateAbbrMaxLength();
      document.getElementById('f_value').value = r.value || '';
      document.getElementById('f_abbr').value  = r.abbr  || '';
      renderTable();
    }

    async function saveRow(mode) {
      if (!canEdit()) { showMsg('閲覧のみモードのため変更できません', 'err'); return; }
      const kind  = document.getElementById('f_kind').value;
      const value = document.getElementById('f_value').value.trim();
      const abbr  = document.getElementById('f_abbr').value.trim() || null;
      if (!value) { showMsg('候補の名前を入力してください', 'err'); return; }

      if (mode === 'update') {
        if (!selectedId) { showMsg('更新する行を選択してください', 'err'); return; }
        const exists = rows.find(r => r.kind === kind && r.value === value && r.id !== selectedId);
        if (exists) { showMsg(`「${value}」はすでに登録されています`, 'err'); return; }
        const { error } = await sb.from('shift_car_type').update({ kind, value, abbr }).eq('id', selectedId);
        if (error) { showMsg('更新に失敗しました: ' + error.message, 'err'); return; }
        logChange('車両サイズ・車両タイプマスタ', '更新', `${KIND_LABEL[kind]}「${value}」`);
        showMsg('更新しました', 'ok');
      } else {
        const exists = rows.find(r => r.kind === kind && r.value === value);
        if (exists) { showMsg(`「${value}」はすでに登録されています`, 'err'); return; }
        const { error } = await sb.from('shift_car_type').insert({ kind, value, abbr });
        if (error) { showMsg('登録に失敗しました: ' + error.message, 'err'); return; }
        logChange('車両サイズ・車両タイプマスタ', '追加', `${KIND_LABEL[kind]}「${value}」`);
        showMsg('登録しました', 'ok');
      }
      selectedId = null;
      document.getElementById('f_value').value = '';
      document.getElementById('f_abbr').value  = '';
      await loadRows();
    }

    async function deleteRow() {
      if (!canEdit()) { showMsg('閲覧のみモードのため削除できません', 'err'); return; }
      if (!selectedId) { showMsg('削除する行を選択してください', 'err'); return; }
      const target = rows.find(r => r.id === selectedId);
      if (!confirm(`「${target?.value || ''}」を削除しますか？\n（すでにこの候補を選んでいる車両からは消えませんが、新しく選べなくなります）`)) return;
      const { error } = await sb.from('shift_car_type').delete().eq('id', selectedId);
      if (error) { showMsg('削除に失敗しました: ' + error.message, 'err'); return; }
      logChange('車両サイズ・車両タイプマスタ', '削除', `${KIND_LABEL[target?.kind]}「${target?.value || ''}」`);
      showMsg('削除しました', 'ok');
      selectedId = null;
      document.getElementById('f_value').value = '';
      document.getElementById('f_abbr').value  = '';
      await loadRows();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    // 上のフォーム部分（.sticky-header）の高さに合わせて、表の見出し行（th）の固定位置をずらす。
    (function () {
      const sh = document.querySelector('.sticky-header');
      if (!sh) return;
      const update = () => document.documentElement.style.setProperty('--sticky-offset', sh.offsetHeight + 'px');
      update();
      new ResizeObserver(update).observe(sh);
    })();

    init();
  </script>
</body>
</html>
