<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>有給管理</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0 auto; padding: 10px; background: #f5f5f5; max-width: 760px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 10px 0; }
    h2 { font-size: 1rem; margin: 18px 0 8px; display: flex; align-items: center; gap: 10px; }
    .back { display: block; text-align: center; margin: 8px 0; color: #4a90e2; text-decoration: none; width: fit-content; margin-left: auto; margin-right: auto; }
    .desc { background: #e8f8e8; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.85rem; }
    .sticky-header { position: sticky; top: 0; z-index: 20; background: #f5f5f5; padding-top: 2px; padding-bottom: 6px; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 8px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; justify-content: center; }
    .filter-btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; }

    .form-box { background: #eafaf1; border-radius: 8px; padding: 8px; margin-bottom: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .form-table { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
    .form-cell { display: block; }
    .form-cell label { display: block; font-size: 0.75rem; color: #666; text-align: center; margin-bottom: 3px; }
    .form-cell input, .form-cell select {
      width: 100%; font-size: 0.85rem; padding: 4px 2px;
      border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; text-align: center;
    }
    .btn-row { display: flex; gap: 6px; margin-top: 6px; }
    button { font-size: 0.85rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; }
    .btn-add    { background: #27ae60; }

    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); font-size: 0.85rem; table-layout: fixed; margin-bottom: 16px; }
    th { background: #eee; padding: 7px 4px; text-align: center; border-bottom: 1px solid #ddd; }
    td { padding: 6px 4px; text-align: center; border-bottom: 1px solid #f0f0f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    tr:hover td { background: #f0f8ff; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; white-space: nowrap; }
    .loading { text-align: center; padding: 20px; color: #888; }
    .btn-del-row { background: #e74c3c; color: white; border: none; border-radius: 3px; padding: 3px 10px; cursor: pointer; font-size: 0.78rem; }
    .empty-msg { text-align: center; padding: 20px; color: #aaa; }
  </style>
</head>
<body>

  <div class="desc">
    🌴 有休は入社日によって付与日・付与日数がバラバラなので、社員ごとに「付与した日・日数」と「取った日」を、それぞれ登録します。残り日数は「付与した日数の合計」から「取った日数の合計」を引いて計算します。
  </div>

  <div class="sticky-header">
  <h1>🌴 有給管理</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>
  <!-- 所属フィルター -->
  <div class="filter-row" id="filter-row">
    <button class="filter-btn active" style="background:#555;color:white" onclick="filterByBusho('',this)">全員</button>
  </div>
  <!-- 入力フォーム -->
  <div class="form-box">
    <div class="form-table">
      <div class="form-cell" style="width:160px">
        <label>社員</label>
        <select id="f_staff" onchange="onStaffChange()"><option value="">-- 選択 --</option></select>
      </div>
      <div class="form-cell" style="width:110px">
        <label>種別</label>
        <select id="f_kind" onchange="onKindChange()">
          <option value="取得">取得（休んだ日）</option>
          <option value="付与">付与（増えた日）</option>
        </select>
      </div>
      <div class="form-cell" style="width:150px">
        <label id="f_date_label">取得した日</label>
        <input type="date" id="f_date">
      </div>
      <div class="form-cell" id="f_days_cell" style="width:90px;display:none">
        <label>付与日数</label>
        <input type="number" min="1" id="f_days" placeholder="例：10">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add" onclick="addRow()">登録</button>
    </div>
  </div>
  </div>

  <div id="loading" class="loading">読み込み中...</div>
  <div id="main-content" style="display:none">

    <h2>📊 有給の残り日数（本日時点）</h2>
    <table>
      <thead>
        <tr><th>氏名</th><th style="width:90px">付与合計</th><th style="width:90px">取得合計</th><th style="width:90px">残り</th></tr>
      </thead>
      <tbody id="yukyu-tbody"></tbody>
    </table>

    <h2>
      📑 登録一覧
      <input type="month" id="f_ym" onchange="renderTable()" style="width:140px;font-size:0.85rem;padding:3px 4px;border:1px solid #ccc;border-radius:4px;">
    </h2>
    <table>
      <thead>
        <tr>
          <th style="width:110px">日付</th>
          <th>氏名</th>
          <th style="width:70px">種別</th>
          <th style="width:70px">日数</th>
          <th style="width:70px">操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let rows = [];
    let activeStaffs = [];
    let currentFilter = '';

    async function init() {
      masters = await loadMasters();
      activeStaffs = masters.staffs.filter(s => !s.retired).sort((a, b) => a.staff_code.localeCompare(b.staff_code));
      buildFilterButtons();
      buildStaffSelect();
      lockMasterFormIfNeeded();
      onKindChange();
      // 登録一覧の初期表示は今月にしておく
      const now = new Date();
      document.getElementById('f_ym').value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      await loadRows();
    }

    function buildFilterButtons() {
      const row = document.getElementById('filter-row');
      masters.bushos.filter(b => !b.busho_code.startsWith('9') && !b.is_banmen_only).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = b.color_h;
        btn.style.color = getTextColor(b.color_h);
        btn.textContent = b.busho_name;
        btn.onclick = () => filterByBusho(b.busho_code, btn);
        row.appendChild(btn);
      });
    }

    function filterByBusho(bushoCode, btn) {
      currentFilter = bushoCode;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      else document.querySelector('.filter-btn').classList.add('active');
      renderAll();
    }

    function filteredStaffs() {
      return currentFilter ? activeStaffs.filter(s => s.busho_code === currentFilter) : activeStaffs;
    }

    function buildStaffSelect() {
      const sel = document.getElementById('f_staff');
      activeStaffs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.staff_code;
        opt.textContent = s.name || s.staff_code;
        sel.appendChild(opt);
      });
    }

    function pickStaffToForm(staffCode) {
      document.getElementById('f_staff').value = staffCode;
    }

    // 種別（取得／付与）で、日付のラベルと「付与日数」欄の表示を切り替える
    function onKindChange() {
      const isGrant = document.getElementById('f_kind').value === '付与';
      document.getElementById('f_date_label').textContent = isGrant ? '付与した日' : '取得した日';
      document.getElementById('f_days_cell').style.display = isGrant ? '' : 'none';
    }

    function onStaffChange() {}

    function toDateStr(v) { return (v || '').replaceAll('-', ''); }
    function formatDateLabel(v) {
      if (!v || v.length !== 8) return v || '－';
      return `${v.slice(0,4)}年${parseInt(v.slice(4,6))}月${parseInt(v.slice(6,8))}日`;
    }
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }

    async function loadRows() {
      const { data, error } = await sb.from('shift_kenko_yukyu').select('*').in('category', ['有給', '有給付与']).order('date', { ascending: false });
      if (error) { showMsg('データの読み込みに失敗しました: ' + error.message, 'err'); return; }
      rows = data || [];
      renderAll();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = '';
    }

    function renderAll() {
      renderYukyu();
      renderTable();
    }

    // ===== 有給の残り日数（本日時点：付与合計 － 取得合計） =====
    function renderYukyu() {
      const tbody = document.getElementById('yukyu-tbody');
      tbody.innerHTML = '';

      filteredStaffs().forEach(s => {
        const staffRows = rows.filter(r => r.staff_code === s.staff_code);
        const granted = staffRows.filter(r => r.category === '有給付与').reduce((sum, r) => sum + (r.days || 0), 0);
        const used = staffRows.filter(r => r.category === '有給').length;
        const remain = granted - used;
        const remainColor = remain < 0 ? { bg: '#fdecea', col: '#c0392b' } : { bg: '#d4edda', col: '#155724' };
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        tr.title = '押すと、上の登録フォームの「社員」にこの人を入れます';
        tr.onclick = () => pickStaffToForm(s.staff_code);
        tr.innerHTML = `
          <td>${s.name || s.staff_code}</td>
          <td>${granted}日</td>
          <td>${used}日</td>
          <td><span class="badge" style="background:${remainColor.bg};color:${remainColor.col}">${remain}日</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // ===== 登録一覧（選んだ年月のものだけ表示） =====
    const KIND_COLOR = { '有給': { bg: '#e8f8e8', col: '#1e7a1e', label: '取得' }, '有給付与': { bg: '#d6eaf8', col: '#1a5276', label: '付与' } };

    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      const ymInput = document.getElementById('f_ym').value; // "2026-11"
      const ym = ymInput.replace('-', '');

      let filteredRows = rows.filter(r => r.date.slice(0, 6) === ym);
      if (currentFilter) {
        filteredRows = filteredRows.filter(r => (masters.staffMap[r.staff_code] || {}).busho_code === currentFilter);
      }

      if (filteredRows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">この月の登録はありません</td></tr>';
        return;
      }
      filteredRows.forEach(r => {
        const staff = masters.staffMap[r.staff_code];
        const k = KIND_COLOR[r.category] || { bg: '#eee', col: '#555', label: r.category };
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${formatDateLabel(r.date)}</td>
          <td style="cursor:pointer" title="押すと、上の登録フォームの「社員」にこの人を入れます">${staff ? (staff.name || staff.staff_code) : r.staff_code}</td>
          <td><span class="badge" style="background:${k.bg};color:${k.col}">${k.label}</span></td>
          <td>${r.category === '有給付与' ? (r.days || 0) + '日' : '1日'}</td>
          <td><button class="btn-del-row" onclick="deleteRow(${r.id})">削除</button></td>
        `;
        tr.querySelector('td:nth-child(2)').onclick = () => pickStaffToForm(r.staff_code);
        tbody.appendChild(tr);
      });
    }

    async function addRow() {
      if (!canEdit()) { showMsg('閲覧のみモードのため登録できません', 'err'); return; }
      const staffCode = document.getElementById('f_staff').value;
      const kind = document.getElementById('f_kind').value; // 取得 or 付与
      const dateStr = toDateStr(document.getElementById('f_date').value);
      if (!staffCode) { showMsg('社員を選んでください', 'err'); return; }
      if (!dateStr) { showMsg('日付を選んでください', 'err'); return; }

      const category = kind === '付与' ? '有給付与' : '有給';
      let days = null;
      if (kind === '付与') {
        days = parseInt(document.getElementById('f_days').value);
        if (!days || days <= 0) { showMsg('付与日数を入力してください', 'err'); return; }
      } else {
        if (rows.some(r => r.staff_code === staffCode && r.category === '有給' && r.date === dateStr)) {
          showMsg('その人・その日の取得はすでに登録されています', 'err');
          return;
        }
      }

      const { error } = await sb.from('shift_kenko_yukyu').insert({ staff_code: staffCode, category, date: dateStr, days });
      if (error) { showMsg('登録に失敗しました: ' + error.message, 'err'); return; }
      const staff = masters.staffMap[staffCode];
      const who = staff ? (staff.name || staffCode) : staffCode;
      logChange('有給管理', '追加', `社員「${who}」${kind}${formatDateLabel(dateStr)}${days ? `（${days}日）` : ''}`);

      // 「取得」のときだけ、業務シフト・盤面にもその日「有休」として反映する
      if (kind === '取得') {
        await syncToGyomuShift(staffCode, dateStr, '902');
      }

      showMsg('登録しました', 'ok');
      await loadRows();
    }

    // 業務シフト（shift_gyomu_shift）の、その日の欄（午前）に、所属コードを書き込む。
    // すでに別の予定が入っている日は、上書きしていいか必ず確認する
    async function syncToGyomuShift(staffCode, dateStr, code) {
      const yearmonth = dateStr.slice(0, 6);
      const col = 'd' + dateStr.slice(6, 8);
      const { data } = await sb.from('shift_gyomu_shift').select(col).eq('yearmonth', yearmonth).eq('staff_code', staffCode).maybeSingle();
      const current = data ? data[col] : null;
      if (current && current !== 'EMPTY' && current !== code) {
        if (!confirm(`この日の業務シフトには、すでに別の予定（${current}）が入っています。\n有休に変更しますか？`)) {
          showMsg('有給は登録しましたが、業務シフトへの反映はスキップしました', 'ok');
          return;
        }
      }
      const { error } = await sb.from('shift_gyomu_shift').upsert(
        { yearmonth, staff_code: staffCode, [col]: code },
        { onConflict: 'yearmonth,staff_code' }
      );
      if (error) { showMsg('業務シフトへの反映に失敗しました: ' + error.message, 'err'); }
    }

    async function deleteRow(id) {
      if (!canEdit()) { showMsg('閲覧のみモードのため削除できません', 'err'); return; }
      const target = rows.find(r => r.id === id);
      const staff0 = target ? masters.staffMap[target.staff_code] : null;
      const who = staff0 ? (staff0.name || target.staff_code) : (target ? target.staff_code : '');
      const kindLabel = target && target.category === '有給付与' ? '付与' : '取得';
      if (!confirm(`「${who}」さんの${target ? formatDateLabel(target.date) : ''}の${kindLabel}記録を削除しますか？`)) return;
      const { error } = await sb.from('shift_kenko_yukyu').delete().eq('id', id);
      if (error) { showMsg('削除に失敗しました: ' + error.message, 'err'); return; }
      if (target) {
        logChange('有給管理', '削除', `社員「${who}」${kindLabel}${formatDateLabel(target.date)}`);
      }
      showMsg('削除しました', 'ok');
      await loadRows();
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = `msg ${type}`;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    init();
  </script>
</body>
</html>
