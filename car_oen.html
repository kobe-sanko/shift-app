<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両貸出一覧</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; background: #f5f5f5; }
    h1 { font-size: 1.2rem; text-align: center; margin: 6px 0; }
    .back { display: table; text-align: center; margin: 4px auto 8px; color: #4a90e2; text-decoration: none; }
    .top-bar { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .month-select { font-size: 0.9rem; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn { font-size: 0.82rem; padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; color: white; background: #4a90e2; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 8px; }
    .filter-btn { padding: 3px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; }
    .msg { text-align: center; font-size: 0.85rem; padding: 6px; border-radius: 4px; margin-bottom: 6px; display: none; }
    .msg.ok  { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #fdecea; color: #c0392b; display: block; }

    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; background: white; font-size: 0.75rem; white-space: nowrap; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin: 0 auto; }
    th { background: #dde; padding: 4px 3px; text-align: center; border: 1px solid #ccc; min-width: 34px; }
    th.name-th { min-width: 100px; position: sticky; left: 0; z-index: 2; background: #dde; }
    th.sat { background: #d0e8ff; }
    th.sun { background: #ffd0d0; }
    td { padding: 3px 2px; text-align: center; border: 1px solid #eee; vertical-align: top; }
    td.name-td { position: sticky; left: 0; background: white; z-index: 1; padding: 3px 6px; min-width: 100px; font-size: 0.78rem; text-align: center; vertical-align: middle; }
    td.name-td .home-badge { display: block; font-size: 0.65rem; font-weight: bold; border-radius: 3px; padding: 1px 4px; margin-top: 2px; }
    td.sat-col { background: #f0f6ff; }
    td.sun-col { background: #fff0f0; }
    tr.hidden { display: none; }
    .badge-wrap { display: flex; gap: 2px; justify-content: center; align-items: flex-start; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 2px 1px; border-radius: 3px; font-size: 0.68rem; font-weight: bold;
      min-width: 16px; min-height: 30px;
      writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 1px;
    }
    .loading { text-align: center; padding: 30px; color: #888; font-size: 1rem; }
  </style>
</head>
<body>
  <h1 id="page-title">🚚 車両貸出一覧</h1>
  <a class="back" href="index.html">← メニューへ</a>
  <div id="msg" class="msg"></div>

  <div class="top-bar">
    <select class="month-select" id="month-sel" onchange="loadData()"></select>
    <button class="btn" onclick="loadData()">表示</button>
    <button class="btn" id="inner-move-toggle" style="background:#888" onclick="toggleInnerMove()">グループ内の貸し出しも表示</button>
    <button class="btn" id="badge-mode-toggle" style="background:#16a085" onclick="toggleBadgeMode()">🔀 表示：貸出先の所属名</button>
  </div>

  <div class="filter-row" id="group-filter-row"></div>
  <div class="filter-row" id="filter-row"></div>

  <div class="loading" id="loading">読み込み中…</div>

  <div class="table-wrap" id="table-wrap" style="display:none">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    let masters = {};
    let carRows = [];
    let lendRows = [];  // 盤面データから算出した貸出実績（{date, car_code, fromBusho, toBusho, driver}の配列）
    let currentYM = '';
    let daysInMonth = 31;
    let currentFilter = null; // null = 全車両。絞り込み中は所属コードの配列（車の本来の所属で絞り込む）
    let showInnerMove = false; // 上位部門が同じ所属同士の貸し出し（グループ内）も表示するかどうか
    let badgeLabelMode = 'busho'; // 'busho'=貸出先の所属名で表示 / 'driver'=運転者名で表示

    function toggleInnerMove() {
      showInnerMove = !showInnerMove;
      const btn = document.getElementById('inner-move-toggle');
      btn.style.background = showInnerMove ? '#2980b9' : '#888';
      renderTable();
    }

    function toggleBadgeMode() {
      badgeLabelMode = badgeLabelMode === 'busho' ? 'driver' : 'busho';
      document.getElementById('badge-mode-toggle').textContent =
        badgeLabelMode === 'busho' ? '🔀 表示：貸出先の所属名' : '🔀 表示：運転者名';
      renderTable();
    }

    async function init() {
      masters = await loadMasters();

      currentYM = typeof getCurrentYearMonth === 'function' ? getCurrentYearMonth()
        : (() => { const n = new Date(); return `${n.getFullYear()}${String(n.getMonth() + 1).padStart(2, '0')}`; })();
      buildMonthSelect();
      buildFilterButtons();

      await loadData();
    }

    // ===== 月セレクト =====
    function buildMonthSelect() {
      const sel = document.getElementById('month-sel');
      const now = new Date();
      for (let i = -6; i <= 1; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const ym = `${y}${m}`;
        const opt = document.createElement('option');
        opt.value = ym;
        opt.textContent = `${y}年${m}月`;
        if (ym === currentYM) opt.selected = true;
        sel.appendChild(opt);
      }
    }

    // ===== 部門（上位グループ）・所属フィルターボタン（900番台は除く）=====
    // 車の「本来の所属」（社員マスタではなく車両マスタのbusho_code）で絞り込む
    function buildFilterButtons() {
      const normalBushos = masters.bushos.filter(b => parseInt(b.busho_code) < 900);

      const groupRow = document.getElementById('group-filter-row');
      const groupNames = [...new Set(normalBushos.map(b => b.group_name).filter(v => v))];
      groupNames.forEach(groupName => {
        const bushoCodes = normalBushos.filter(b => b.group_name === groupName).map(b => b.busho_code);
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = '#8e44ad';
        btn.style.color = '#fff';
        btn.textContent = `📦${groupName}`;
        btn.onclick = () => toggleFilter(bushoCodes, btn);
        groupRow.appendChild(btn);
      });

      const row = document.getElementById('filter-row');
      normalBushos.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.style.background = b.color_h || '#888';
        btn.style.color = getTextColor(b.color_h || '#888');
        btn.textContent = b.busho_name;
        btn.onclick = () => toggleFilter([b.busho_code], btn);
        row.appendChild(btn);
      });
    }

    // 「全車両」ボタン：絞り込みをすべて解除する
    function filterTable(bushoCodes, btn) {
      currentFilter = null;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTable();
    }

    // 所属・部門ボタン：押すたびに選択を追加／解除する（複数選択できる）
    function toggleFilter(bushoCodes, btn) {
      if (!currentFilter) currentFilter = new Set();

      const isActive = btn.classList.contains('active');
      if (isActive) {
        bushoCodes.forEach(c => currentFilter.delete(c));
        btn.classList.remove('active');
      } else {
        bushoCodes.forEach(c => currentFilter.add(c));
        btn.classList.add('active');
      }

      // 「全車両」ボタンは、個別の絞り込みが1つもない時だけ有効にする
      const allBtn = document.getElementById('btn-show-all-car');
      if (currentFilter.size === 0) {
        currentFilter = null;
        if (allBtn) allBtn.classList.add('active');
      } else if (allBtn) {
        allBtn.classList.remove('active');
      }
      renderTable();
    }

    // ===== データ読み込み =====
    async function loadData() {
      currentYM = document.getElementById('month-sel').value || currentYM;
      document.getElementById('loading').style.display = 'block';
      document.getElementById('table-wrap').style.display = 'none';

      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));
      daysInMonth = new Date(year, month, 0).getDate();

      const startStr = `${currentYM}01`;
      const endStr = `${currentYM}${String(daysInMonth).padStart(2, '0')}`;

      const [carRes, banmenRes] = await Promise.all([
        sb.from('shift_car').select('car_code, car_no, busho_code').eq('is_active', true).order('car_code'),
        sb.from('shift_banmen').select('date, busho_code, car_code, driver')
          .gte('date', startStr).lte('date', endStr).not('car_code', 'is', null),
      ]);

      if (carRes.error || banmenRes.error) {
        showMsg('データの読み込みに失敗しました', 'err');
        console.error(carRes.error || banmenRes.error);
        return;
      }

      carRows = carRes.data || [];
      lendRows = buildLendRowsFromBanmen(carRows, banmenRes.data || []);

      buildHeader();
      renderTable();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('table-wrap').style.display = 'block';
    }

    // ===== 盤面データから「貸出」実績を算出する =====
    // 考え方：その日その車が置かれていた所属（盤面のbusho_code）が、車両マスタに登録された
    // 本来の所属と違っていれば「貸出」とみなす。
    function buildLendRowsFromBanmen(carList, banmenData) {
      const carHomeMap = {};
      carList.forEach(c => { carHomeMap[c.car_code] = c.busho_code; });

      const bushoGroupMap = {};
      (masters.bushos || []).forEach(b => { bushoGroupMap[b.busho_code] = b.group_name || null; });

      const result = [];
      const seen = new Set(); // car_code|date|toBusho の重複（同じ枠が複数回ヒットした場合など）を防ぐ

      banmenData.forEach(r => {
        const homeBusho = carHomeMap[r.car_code];
        if (!homeBusho) return; // 車両マスタに無い（削除済みなど）車は対象外
        const toBusho = r.busho_code;
        if (!toBusho || toBusho === homeBusho) return;
        if (toBusho === 'お休み') return;

        const key = `${r.car_code}|${r.date}|${toBusho}`;
        if (seen.has(key)) return;
        seen.add(key);

        const isInnerMove = !!(bushoGroupMap[homeBusho] && bushoGroupMap[homeBusho] === bushoGroupMap[toBusho]);
        result.push({ car_code: r.car_code, date: r.date, fromBusho: homeBusho, toBusho, driver: r.driver, isInnerMove });
      });

      return result;
    }

    // ===== ヘッダー（日付列）構築 =====
    function buildHeader() {
      const thead = document.getElementById('thead');
      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));

      let html = '<tr><th class="name-th">車番</th>';
      for (let d = 1; d <= daysInMonth; d++) {
        const wd = new Date(year, month - 1, d).getDay();
        const cls = wd === 0 ? 'sun' : wd === 6 ? 'sat' : '';
        html += `<th class="${cls}">${d}<br><span style="font-size:0.62rem">${getWeekdayName(wd)}</span></th>`;
      }
      html += '</tr>';
      thead.innerHTML = html;
    }

    function getDayClass(d) {
      const year = parseInt(currentYM.substring(0, 4));
      const month = parseInt(currentYM.substring(4, 6));
      const wd = new Date(year, month - 1, d).getDay();
      return wd === 0 ? 'sun-col' : wd === 6 ? 'sat-col' : '';
    }

    // ===== 本体テーブル描画 =====
    function renderTable() {
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';

      // car_code → 日付ごとの貸出エントリー一覧（「グループ内も表示」がOFFのときは、グループ内を除く）
      const byCar = {};
      lendRows.filter(r => showInnerMove || !r.isInnerMove).forEach(r => {
        if (!byCar[r.car_code]) byCar[r.car_code] = {};
        if (!byCar[r.car_code][r.date]) byCar[r.car_code][r.date] = [];
        byCar[r.car_code][r.date].push(r);
      });

      // その月に貸出実績がある車だけ表示（車番順）
      const targetCarCodes = Object.keys(byCar).sort((a, b) =>
        (parseInt(a) || 0) - (parseInt(b) || 0)
      );

      targetCarCodes.forEach(carCode => {
        const car = carRows.find(c => c.car_code === carCode);
        const carNo = car?.car_no || carCode;
        const homeBusho = masters.bushoMap[car?.busho_code];
        const dayMap = byCar[carCode];

        // フィルター中：ボタンを押した所属に属する車だけ表示（貸出先ではなく、本来の所属で絞り込む）
        if (currentFilter && !currentFilter.has(car?.busho_code)) return;

        const homeBadgeHtml = homeBusho
          ? `<span class="home-badge" style="background:${homeBusho.color_h};color:${getTextColor(homeBusho.color_h)}">${homeBusho.busho_name}</span>`
          : '';
        let rowHtml = `<tr><td class="name-td">${carNo}${homeBadgeHtml}</td>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${currentYM}${String(d).padStart(2, '0')}`;
          const entries = dayMap[dateStr] || [];

          const badges = entries.map(e => {
            const b = masters.bushoMap[e.toBusho];
            const color = b?.color_h || '#888';
            const bushoName = b?.busho_name || e.toBusho;
            const driverName = masters.staffMap[e.driver]?.name || (e.driver || '－');
            const label = badgeLabelMode === 'driver' ? driverName : bushoName;
            const innerStyle = e.isInnerMove ? 'opacity:0.55;' : '';
            return `<span class="badge" style="background:${color};color:${getTextColor(color)};${innerStyle}">${label}</span>`;
          }).join('');

          rowHtml += `<td class="${getDayClass(d)}"><div class="badge-wrap">${badges}</div></td>`;
        }
        rowHtml += '</tr>';
        tbody.insertAdjacentHTML('beforeend', rowHtml);
      });

      if (tbody.innerHTML === '') {
        tbody.innerHTML = `<tr><td colspan="${daysInMonth + 1}" style="padding:20px;color:#888;">この月の貸出データはありません</td></tr>`;
      }
    }

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
      setTimeout(() => { el.className = 'msg'; }, 3000);
    }

    init();
  </script>
</body>
</html>
