<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車両使用状況</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="common.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0 auto; padding: 10px; background: #f5f5f5; max-width: 1300px; }
    h1 { font-size: 1.2rem; text-align: center; margin: 8px 0; }
    .back { display: block; text-align: center; margin-bottom: 8px; color: #4a90e2; text-decoration: none; }
    .date-nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .date-nav button { background: #444; color: white; border: none; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 1rem; }
    .date-nav button:hover { background: #666; }
    .date-label { font-size: 1.05rem; font-weight: bold; min-width: 170px; text-align: center; }
    .date-nav input[type="date"] { position: absolute; opacity: 0; width: 0; height: 0; }

    .summary-row { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; font-size: 0.82rem; }
    .summary-chip { padding: 4px 12px; border-radius: 14px; font-weight: bold; color: white; }
    .summary-used    { background: #27ae60; }
    .summary-unused  { background: #95a5a6; }
    .summary-syaken  { background: #e67e22; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 4px; }
    .filter-btn { padding: 4px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.85rem; opacity: 0.4; }
    .filter-btn.active { outline: 3px solid #333; font-weight: bold; opacity: 1; }
    .filter-hint { text-align: center; font-size: 0.72rem; color: #999; margin-bottom: 10px; }

    .legend { display: flex; justify-content: center; gap: 14px; font-size: 0.74rem; color: #666; margin-bottom: 10px; flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

    /* 部署ごとに縦の列として並べる（指定の順番：宅配業務課→企業物流課→流通業務課→その他） */
    .dept-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }
    .dept-columns.single { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
    .dept-col { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); overflow: hidden; }
    .dept-col-title { padding: 6px 10px; font-weight: bold; font-size: 0.88rem; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    thead th {
      background: #333; color: white; padding: 4px 6px; text-align: center; font-size: 0.72rem;
    }
    tbody td { padding: 3px 6px; border-bottom: 1px solid #eee; text-align: center; }
    tbody tr:hover td { background: #f7fbff; }
    td.car-no-col { font-weight: bold; white-space: nowrap; width: 64px; }
    .busho-badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 0.66rem; font-weight: bold; white-space: nowrap; }
    td.status-col { white-space: nowrap; }
    .status-used   { background: #eafaf0; color: #1e7e42; }
    .status-unused { background: #fdecea; color: #c0392b; font-weight: bold; }
    .status-syaken { background: #fdf0e0; color: #a85c00; }
    .status-name { font-weight: bold; }
    .ampm-line { font-size: 0.72rem; line-height: 1.3; }
    .ampm-line .u { color: #c0392b; font-weight: bold; }

    @media (max-width: 900px) {
      .dept-columns { grid-template-columns: 1fr; }
    }

    .loading { text-align: center; padding: 20px; color: #888; }
    .empty-msg { text-align: center; padding: 20px; color: #aaa; }
  </style>
</head>
<body>
  <h1>🚗 車両使用状況</h1>
  <a class="back" href="index.html">← メニューへ</a>

  <div class="date-nav">
    <button onclick="changeDate(-1)">◀</button>
    <span class="date-label" id="date-label">読込中...</span>
    <button onclick="changeDate(1)">▶</button>
    <button onclick="document.getElementById('date-picker').showPicker()" style="background:#444;">📅</button>
    <input type="date" id="date-picker" onchange="onDatePicked(this.value)">
  </div>

  <div class="legend">
    <span><span class="legend-dot" style="background:#27ae60"></span>使用中（運転者名を表示）</span>
    <span><span class="legend-dot" style="background:#e74c3c"></span>未使用</span>
    <span><span class="legend-dot" style="background:#e67e22"></span>車検・修理中</span>
  </div>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn" id="btn-show-all" style="background:#555;color:white;opacity:1" onclick="selectAllBusho()">全部表示</button>
  </div>
  <div class="filter-hint">↑ 所属：クリックで表示／非表示を切り替えられます（複数選択可）</div>

  <div class="filter-row" id="status-filter-row">
    <button class="filter-btn active" data-status="used"   style="background:#27ae60;color:white" onclick="toggleStatus('used', this)">使用中</button>
    <button class="filter-btn active" data-status="unused" style="background:#e74c3c;color:white" onclick="toggleStatus('unused', this)">未使用</button>
    <button class="filter-btn active" data-status="syaken" style="background:#e67e22;color:white" onclick="toggleStatus('syaken', this)">車検・修理中</button>
  </div>
  <div class="filter-hint">↑ 状態：クリックで表示／非表示を切り替えられます（午前だけ使用など、半日だけ使用した車は「使用中」「未使用」の両方に出ます）</div>

  <div id="loading" class="loading">読み込み中...</div>
  <div id="body-area" style="display:none">
    <div class="dept-columns" id="dept-columns"></div>
    <div id="empty-msg" class="empty-msg" style="display:none">対象の車両がありません</div>
  </div>

  <script>
    // 部署を表示したい順番（ここに無い部署は、この後にアルファベット順で続く）
    const DEPT_ORDER = ['宅配業務課', '企業物流課', '流通業務課'];

    let masters = {};
    let currentDate = new Date();
    let carRows = [];
    let carInfoMap = {};             // car_code → { driverName, driverAmpm }（その日・配送で割り当てられている場合）
    let syakenCarCodes = new Map();  // car_code → 理由（車検・修理など）
    let selectedBushoCodes = new Set(); // 一覧に表示する所属コード（空＝全部表示扱いにはしない。初期化時に全件入れる）
    let selectedStatuses = new Set(['used', 'unused', 'syaken']); // 一覧に表示する状態（使用中・未使用・車検修理中）

    function getDateStr(d) {
      return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
    }
    function getDateLabel(d) {
      const wds = ['日','月','火','水','木','金','土'];
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wds[d.getDay()]}）`;
    }
    function changeDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      loadData();
    }
    function onDatePicked(str) {
      if (!str) return;
      const [y, m, d] = str.split('-').map(Number);
      currentDate = new Date(y, m - 1, d);
      loadData();
    }

    const BUSHO_FILTER_STORAGE_KEY = 'car_status_selected_busho_codes';

    async function init() {
      masters = await loadMasters();
      const allCodes = masters.bushos.filter(b => !b.busho_code.startsWith('9')).map(b => b.busho_code);

      // 前回選んだ状態があればそれを復元し、無ければ全部表示にする
      const saved = loadSavedBushoSelection();
      if (saved) {
        allCodes.forEach(code => { if (saved.includes(code)) selectedBushoCodes.add(code); });
      } else {
        allCodes.forEach(code => selectedBushoCodes.add(code));
      }

      buildFilterButtons();
      await loadData();
    }

    function loadSavedBushoSelection() {
      try {
        const raw = localStorage.getItem(BUSHO_FILTER_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function saveBushoSelection() {
      try {
        localStorage.setItem(BUSHO_FILTER_STORAGE_KEY, JSON.stringify([...selectedBushoCodes]));
      } catch (e) {
        // 保存できなくても画面の動作には影響しない
      }
    }

    function buildFilterButtons() {
      // フィルターボタンは所属マスタの順番（所属コード順）のまま、変更しない
      const row = document.getElementById('filter-row');
      masters.bushos.filter(b => !b.busho_code.startsWith('9')).forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (selectedBushoCodes.has(b.busho_code) ? ' active' : '');
        btn.dataset.bushoCode = b.busho_code;
        btn.style.background = b.color_h;
        btn.style.color = getTextColor(b.color_h);
        btn.textContent = b.busho_name;
        btn.onclick = () => toggleBusho(b.busho_code, btn);
        row.appendChild(btn);
      });
    }

    // 所属マスタの「上位部門」(group_name) を取得。未設定の所属は所属名をそのまま使う
    function getGroupName(bushoCode) {
      const b = masters.bushoMap[bushoCode];
      if (!b) return '所属未設定';
      return b.group_name || b.busho_name;
    }

    // 上位部門を、指定した順番（宅配業務課→企業物流課→流通業務課→その他）で並べる
    function sortGroupNames(names) {
      return names.slice().sort((a, b) => {
        const ai = DEPT_ORDER.indexOf(a);
        const bi = DEPT_ORDER.indexOf(b);
        const ak = ai === -1 ? DEPT_ORDER.length : ai;
        const bk = bi === -1 ? DEPT_ORDER.length : bi;
        if (ak !== bk) return ak - bk;
        return a.localeCompare(b, 'ja');
      });
    }

    // 所属ボタンをクリック → その所属だけ表示/非表示を切り替える（複数選択可）
    function toggleBusho(bushoCode, btn) {
      if (selectedBushoCodes.has(bushoCode)) {
        selectedBushoCodes.delete(bushoCode);
        btn.classList.remove('active');
      } else {
        selectedBushoCodes.add(bushoCode);
        btn.classList.add('active');
      }
      saveBushoSelection();
      renderBody();
    }

    // 「全部表示」ボタン → すべての所属を表示状態に戻す
    function selectAllBusho() {
      selectedBushoCodes.clear();
      document.querySelectorAll('#filter-row .filter-btn[data-busho-code]').forEach(b => {
        selectedBushoCodes.add(b.dataset.bushoCode);
        b.classList.add('active');
      });
      saveBushoSelection();
      renderBody();
    }

    // 状態ボタン（使用中／未使用／車検・修理中）をクリック → 表示/非表示を切り替える
    function toggleStatus(statusKey, btn) {
      if (selectedStatuses.has(statusKey)) {
        selectedStatuses.delete(statusKey);
        btn.classList.remove('active');
      } else {
        selectedStatuses.add(statusKey);
        btn.classList.add('active');
      }
      renderBody();
    }

    // その車が「使用中」「未使用」「車検・修理中」のどれに当てはまるかを判定する（複数当てはまることもある）
    // 例：午前だけ使用・午後は未使用の車 → 使用中・未使用の両方
    function getCarCategories(carCode) {
      if (syakenCarCodes.has(carCode)) return new Set(['syaken']);
      const amState = getSlotState(carCode, 'am');
      const pmState = getSlotState(carCode, 'pm');
      const cats = new Set();
      if (amState.used || pmState.used) cats.add('used');
      if (!amState.used || !pmState.used) cats.add('unused');
      return cats;
    }

    async function loadData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('body-area').style.display = 'none';

      const dateStr = getDateStr(currentDate);
      document.getElementById('date-label').textContent = getDateLabel(currentDate);

      // 盤面1・盤面2どちらの所属も区別せず、その日のすべての配置データから「使われている車」「誰が使っているか」を集める
      const [carRes, staffRes, banmenRes, syakenRes] = await Promise.all([
        sb.from('shift_car').select('*').eq('is_active', true),
        sb.from('shift_staff').select('staff_code,name'),
        sb.from('shift_banmen').select('car_code,driver,driver_ampm').eq('date', dateStr).eq('gyomu_code', '配送'),
        sb.from('shift_syaken').select('car_code, memo').eq('date', dateStr),
      ]);

      carRows = (carRes.data || []).slice().sort((a, b) => (parseInt(a.car_code) || 0) - (parseInt(b.car_code) || 0));
      const staffNameMap = Object.fromEntries((staffRes.data || []).map(s => [s.staff_code, s.name]));

      // car_code ごとに運転者情報をまとめる（1台に複数行が紐づくことは基本ないが、念のため最後に見つかったものを優先）
      carInfoMap = {};
      (banmenRes.data || []).forEach(r => {
        if (!r.car_code) return;
        carInfoMap[r.car_code] = {
          driverName: r.driver ? (staffNameMap[r.driver] || r.driver) : null,
          driverAmpm: r.driver_ampm || null, // null=終日 / 'am'=午前のみ / 'pm'=午後のみ
        };
      });

      syakenCarCodes = new Map((syakenRes.data || []).map(r => [r.car_code, r.memo || '車検']));

      renderBody();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('body-area').style.display = '';
    }

    // その車の午前／午後それぞれの状態を判定する
    function getSlotState(carCode, slot) {
      const info = carInfoMap[carCode];
      if (!info || !info.driverName) return { used: false, name: null };
      if (info.driverAmpm === 'am' && slot === 'pm') return { used: false, name: null };
      if (info.driverAmpm === 'pm' && slot === 'am') return { used: false, name: null };
      return { used: true, name: info.driverName };
    }

    // 状態の表示（1台分）。終日使用なら名前だけそのまま表示し、午前のみ／午後のみの場合だけ分けて表示する
    function statusCellHtml(carCode) {
      if (syakenCarCodes.has(carCode)) {
        return `<td class="status-col status-syaken">${syakenCarCodes.get(carCode)}</td>`;
      }
      const info = carInfoMap[carCode];
      if (!info || !info.driverName) {
        return `<td class="status-col status-unused">未使用</td>`;
      }
      if (!info.driverAmpm) {
        // 1日通して使用 → そのまま名前だけ表示
        return `<td class="status-col status-used"><span class="status-name">${info.driverName}</span></td>`;
      }
      // 午前のみ／午後のみの場合だけ、午前・午後を1行にまとめて表示
      const amState = getSlotState(carCode, 'am');
      const pmState = getSlotState(carCode, 'pm');
      const amText = amState.used ? amState.name : '<span class="u">未使用</span>';
      const pmText = pmState.used ? pmState.name : '<span class="u">未使用</span>';
      return `<td class="status-col status-used">
        <span class="ampm-line">午前：${amText}／午後：${pmText}</span>
      </td>`;
    }

    function renderBody() {
      const container = document.getElementById('dept-columns');
      container.innerHTML = '';

      const targetCars = carRows.filter(c =>
        selectedBushoCodes.has(c.busho_code) &&
        [...getCarCategories(c.car_code)].some(cat => selectedStatuses.has(cat))
      );

      document.getElementById('empty-msg').style.display = targetCars.length === 0 ? '' : 'none';
      container.style.display = targetCars.length === 0 ? 'none' : '';
      if (targetCars.length === 0) return;

      // 「上位部門」（所属マスタの group_name）ごとにグループ化し、
      // 指定した順番（宅配業務課→企業物流課→流通業務課→その他）で列を並べる
      const groups = {};
      targetCars.forEach(c => {
        const key = getGroupName(c.busho_code);
        if (!groups[key]) groups[key] = [];
        groups[key].push(c);
      });

      const headColor = '#4a4a4a'; // 上位部門の帯は3列とも同じ濃いグレーに揃える

      // 所属マスタに登録されている順番（所属コード順）をそのまま使う
      const bushoOrderIndex = Object.fromEntries(masters.bushos.map((b, i) => [b.busho_code, i]));

      sortGroupNames(Object.keys(groups)).forEach(groupName => {
        const cars = groups[groupName].slice().sort((a, b) => {
          const ai = bushoOrderIndex[a.busho_code] ?? 9999;
          const bi = bushoOrderIndex[b.busho_code] ?? 9999;
          if (ai !== bi) return ai - bi;
          return (parseInt(a.car_code) || 0) - (parseInt(b.car_code) || 0);
        });
        const col = document.createElement('div');
        col.className = 'dept-col';
        let html = `<div class="dept-col-title" style="background:${headColor};color:${getTextColor(headColor)}">${groupName}</div>
          <table>
            <thead><tr><th style="width:70px">所属</th><th>車番</th><th>状態</th></tr></thead>
            <tbody>`;
        cars.forEach(c => {
          const busho = masters.bushoMap[c.busho_code];
          const bname = busho ? busho.busho_name : '－';
          const bcolor = busho ? busho.color_h : '#999';
          html += `<tr>
            <td><span class="busho-badge" style="background:${bcolor};color:${getTextColor(bcolor)}">${bname}</span></td>
            <td class="car-no-col">${c.car_no || c.car_code}</td>
            ${statusCellHtml(c.car_code)}
          </tr>`;
        });
        html += '</tbody></table>';
        col.innerHTML = html;
        container.appendChild(col);
      });
    }

    init();
  </script>
</body>
</html>
